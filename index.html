<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Школьный Хаб</title>
  <meta name="description" content="Расписание, домашние задания, объявления и чат класса.">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Tailwind CSS через CDN (все стили) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Минимальные кастомные анимации (Tailwind CDN не умеет keyframes) */
    @keyframes toast-in { from { transform: translateY(-16px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes fade-up  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .toast-in { animation: toast-in .25s ease-out; }
    .fade-up  { animation: fade-up .25s ease-out; }

    /* Запрет выделения текста и подсветки тапа на "жестовых" элементах */
    .no-select {
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .hold { opacity: .6; transform: scale(.98); }

    /* Тонкий скроллбар для чата */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }

    /* Отступ для зоны "чёлки" iPhone */
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .pt-safe { padding-top: env(safe-area-inset-top); }

    /* Высота списка сообщений (с фолбэком для старых браузеров) */
    .chat-scroll { height: calc(100vh - 300px); height: calc(100dvh - 290px); }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">

  <!-- ======================= TOAST (уведомление вверху экрана) ======================= -->
  <div id="toast" class="hidden fixed top-3 left-3 right-3 z-[70] rounded-xl bg-amber-400 text-slate-950 shadow-2xl px-4 py-3 flex items-center gap-3 text-sm toast-in max-w-md mx-auto">
    <svg class="shrink-0 w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.9 5h13.8a2 2 0 001.78-3L13.78 4.9a2 2 0 00-3.56 0L4.12 18a2 2 0 001.78 3z"/>
    </svg>
    <div class="flex-1 min-w-0">
      <div class="font-extrabold">Завтра контрольная!</div>
      <div id="toast-text" class="truncate opacity-80 font-medium"></div>
    </div>
    <button id="toast-close" class="shrink-0 w-7 h-7 rounded-full bg-slate-950/10 flex items-center justify-center font-bold" aria-label="Закрыть">✕</button>
  </div>

  <!-- ======================= ЭКРАН ВХОДА (пошаговый выбор) ======================= -->
  <div id="auth-screen" class="min-h-screen flex flex-col">
    <!-- 5 тапов по логотипу или долгое нажатие на заголовок открывают админ-панель -->
    <header class="px-5 pt-safe pt-14 pb-6 text-center">
      <div id="auth-logo" class="no-select mx-auto w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-900/40">
        <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.25c-1.8-1.3-4.6-1.75-7.75-1.25v12.5c3.15-.5 5.95-.05 7.75 1.25 1.8-1.3 4.6-1.75 7.75-1.25V5c-3.15-.5-5.95-.05-7.75 1.25z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.25v12.5"/>
        </svg>
      </div>
      <h1 id="auth-title" class="no-select text-2xl font-extrabold mt-3">Школьный Хаб</h1>
      <p class="text-slate-400 text-sm mt-1">Расписание, домашка, объявления и чат класса</p>
    </header>

    <div class="flex-1 px-4 pb-6 w-full max-w-md mx-auto">
      <!-- Шапка шага выбора -->
      <div class="flex items-center gap-3 mb-4">
        <button id="back-btn" class="hidden h-10 w-10 shrink-0 rounded-full bg-slate-800 flex items-center justify-center hover:bg-slate-700" aria-label="Назад">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <h2 id="select-title" class="text-lg font-bold"></h2>
      </div>
      <div id="select-status" class="text-xs text-slate-500 mb-3"></div>
      <div id="select-list" class="grid gap-2"></div>
    </div>
  </div>

  <!-- ======================= ГЛАВНЫЙ ЭКРАН ======================= -->
  <div id="main-screen" class="hidden min-h-screen flex flex-col">
    <!-- Шапка + вкладки (приклеена вверху) -->
    <div class="sticky top-0 z-30 bg-slate-950/90 backdrop-blur border-b border-slate-800 pt-safe">
      <div class="w-full max-w-md mx-auto">
        <div class="flex items-center gap-3 px-4 pt-2 pb-2">
          <!-- Логотип: 5 тапов открывают админ-панель -->
          <div id="logo" class="no-select shrink-0 h-10 w-10 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center cursor-pointer">
            <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.25c-1.8-1.3-4.6-1.75-7.75-1.25v12.5c3.15-.5 5.95-.05 7.75 1.25 1.8-1.3 4.6-1.75 7.75-1.25V5c-3.15-.5-5.95-.05-7.75 1.25z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.25v12.5"/>
            </svg>
          </div>
          <!-- Заголовок: долгое нажатие 3 секунды открывает админ-панель -->
          <button id="header-title" class="no-select flex-1 text-left leading-tight cursor-pointer transition-transform duration-200">
            <span id="header-text" class="block font-bold text-sm truncate">Находка, Школа №4, 7А</span>
            <span class="block text-[11px] text-slate-400">Твой класс</span>
          </button>
          <button id="change-btn" class="shrink-0 px-3 py-2 rounded-lg bg-slate-800 text-xs font-semibold hover:bg-slate-700 active:scale-95 transition">
            Сменить
          </button>
        </div>

        <!-- Вкладки -->
        <nav class="flex gap-1 px-3 pb-2">
          <button data-tab="schedule" class="tab-btn flex-1 flex flex-col items-center gap-0.5 py-2 rounded-lg text-[11px] font-semibold text-slate-400">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3M4 8h16M5 5h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1z"/>
            </svg>
            <span>Расписание</span>
          </button>
          <button data-tab="homework" class="tab-btn flex-1 flex flex-col items-center gap-0.5 py-2 rounded-lg text-[11px] font-semibold text-slate-400">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6M7 4h10a2 2 0 012 2v14l-3-2-3 2-3-2-3 2V6a2 2 0 012-2z"/>
            </svg>
            <span>Домашка</span>
          </button>
          <button data-tab="announcements" class="tab-btn flex-1 flex flex-col items-center gap-0.5 py-2 rounded-lg text-[11px] font-semibold text-slate-400">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 9a5 5 0 010 6M19.5 6a9 9 0 010 12M8 11h.01M8 15h-1a3 3 0 01-3-3v0a3 3 0 013-3h1v6zm10.5-6a9 9 0 010 12"/>
            </svg>
            <span>Объявл.</span>
          </button>
          <button data-tab="chat" class="tab-btn flex-1 flex flex-col items-center gap-0.5 py-2 rounded-lg text-[11px] font-semibold text-slate-400">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.4-4 8-9 8-1 0-2-.15-2.9-.4L4 21l1.5-3.9A7.8 7.8 0 013 12c0-4.4 4-8 9-8s9 3.6 9 8z"/>
            </svg>
            <span>Чат</span>
          </button>
          <button id="tab-settings-btn" data-tab="settings"
                  class="tab-btn hidden flex-1 flex-col items-center gap-0.5 py-2 rounded-lg text-[11px] font-semibold text-slate-400">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.3 4.3 11 3a1 1 0 0 1 2 0l.7 1.3a1 1 0 0 0 .9.5l1.5-.1a1 1 0 0 1 1 1l.1 1.5c0 .4.2.7.5.9l1.3.7a1 1 0 0 1 0 2l-1.3.7a1 1 0 0 0-.5.9l.1 1.5a1 1 0 0 1-1 1l-1.5-.1a1 1 0 0 0-.9.5L13 21a1 1 0 0 1-2 0l-.7-1.3a1 1 0 0 0-.9-.5l-1.5.1a1 1 0 0 1-1-1l-.1-1.5a1 1 0 0 0-.5-.9l-1.3-.7a1 1 0 0 1 0-2l1.3-.7a1 1 0 0 0 .5-.9L6.5 9a1 1 0 0 1 1-1L9 8.1c.4 0 .7-.2.9-.5l.7-1.3z"/>
              <circle cx="12" cy="12" r="2.6"/>
            </svg>
            <span>Настройки</span>
          </button>
        </nav>
      </div>
    </div>

    <!-- Контент вкладок -->
    <main class="flex-1 w-full max-w-md mx-auto px-4 py-4 pb-safe">
      <section id="tab-schedule" class="tab space-y-4"></section>
      <section id="tab-homework" class="tab hidden space-y-3"></section>
      <section id="tab-announcements" class="tab hidden space-y-3"></section>
      <section id="tab-chat" class="tab hidden flex flex-col">
        <div class="flex items-center justify-between mb-2">
          <p class="text-xs text-slate-400">Ты в чате как <button id="chat-nick" class="font-bold text-indigo-400 underline decoration-dotted">—</button></p>
        </div>
        <div id="chat-messages" class="chat-scroll space-y-3 overflow-y-auto pr-1"></div>
        <form id="chat-form" class="flex gap-2 mt-3 pt-3 border-t border-slate-800 bg-slate-950/90 backdrop-blur">
          <input id="chat-input" type="text" maxlength="500" autocomplete="off"
                 placeholder="Сообщение…"
                 class="flex-1 min-w-0 rounded-xl bg-slate-800 border border-slate-700 px-4 py-2.5 text-sm placeholder-slate-500 outline-none focus:border-indigo-500 transition">
          <button type="submit" class="shrink-0 h-11 w-11 rounded-xl bg-indigo-600 flex items-center justify-center hover:bg-indigo-500 active:scale-95 transition" aria-label="Отправить">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9-7-9-7v14zm0 0V5"/>
            </svg>
          </button>
        </form>
      </section>
      <section id="tab-settings" class="tab hidden space-y-4"></section>
    </main>
  </div>

  <!-- ======================= МОДАЛКА НИКА ======================= -->
  <div id="nick-modal" class="hidden fixed inset-0 z-[60] items-center justify-center bg-black/70 backdrop-blur-sm p-4">
    <div class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-800 p-5 shadow-2xl">
      <h3 class="text-lg font-bold">Как тебя зовут?</h3>
      <p class="text-sm text-slate-400 mt-1">Ник будет виден одноклассникам в чате.</p>
      <input id="nick-input" type="text" maxlength="30" autocomplete="nickname"
             placeholder="Введите ник"
             class="mt-4 w-full rounded-xl bg-slate-800 border border-slate-700 px-4 py-2.5 text-sm placeholder-slate-500 outline-none focus:border-indigo-500 transition">
      <p id="nick-error" class="hidden text-xs text-rose-400 mt-2"></p>
      <button id="nick-save" class="mt-4 w-full rounded-xl bg-indigo-600 py-3 text-sm font-bold hover:bg-indigo-500 active:scale-[.98] transition">
        Сохранить
      </button>
    </div>
  </div>

  <!-- ======================= АДМИН-ПАНЕЛЬ ======================= -->
  <div id="admin-panel" class="hidden fixed inset-0 z-40">
    <div id="admin-overlay" class="absolute inset-0 bg-black/60"></div>
    <div class="absolute inset-x-0 bottom-0 top-8 bg-slate-900 rounded-t-3xl border-t border-slate-700 flex flex-col">
      <div class="flex items-center justify-between px-5 pt-4 pb-3 border-b border-slate-800">
        <div class="flex items-center gap-2">
          <svg class="w-5 h-5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          <h2 class="font-extrabold">Админ-панель</h2>
        </div>
        <button id="admin-close" class="h-9 w-9 rounded-full bg-slate-800 flex items-center justify-center font-bold hover:bg-slate-700" aria-label="Закрыть">✕</button>
      </div>

      <nav id="admin-nav" class="grid grid-cols-6 gap-0.5 px-2 py-3 border-b border-slate-800">
        <button data-apage="cities"  class="apage-btn py-2 rounded-lg text-[11px] font-semibold bg-slate-800 text-white">Города</button>
        <button data-apage="schools" class="apage-btn py-2 rounded-lg text-[11px] font-semibold text-slate-400">Школы</button>
        <button data-apage="classes" class="apage-btn py-2 rounded-lg text-[11px] font-semibold text-slate-400">Классы</button>
        <button data-apage="content" class="apage-btn py-2 rounded-lg text-[11px] font-semibold text-slate-400">Данные</button>
        <button data-apage="people"  class="apage-btn py-2 rounded-lg text-[11px] font-semibold text-slate-400">Люди и чат</button>
        <button data-apage="stats"   class="apage-btn py-2 rounded-lg text-[11px] font-semibold text-slate-400">Статистика</button>
      </nav>

      <div id="admin-body" class="flex-1 overflow-y-auto p-4"></div>
    </div>
  </div>

  <!-- Модалка входа в режим администратора -->
  <div id="pass-modal" class="hidden fixed inset-0 z-40">
    <div id="pass-overlay" class="absolute inset-0 bg-black/60"></div>
    <div class="absolute inset-x-0 bottom-0 rounded-t-3xl border-t border-slate-700 bg-slate-900 p-5 flex flex-col gap-4">
      <div>
        <h3 class="font-extrabold text-base">Вход для администратора</h3>
        <p class="text-xs text-slate-500 mt-1">Введите пароль, чтобы получить вкладку «Настройки».</p>
      </div>
      <input id="pass-input" type="password" placeholder="Пароль администратора"
             class="w-full rounded-xl bg-slate-800 border border-slate-700 px-4 py-2.5 text-sm placeholder-slate-500 outline-none focus:border-indigo-500 transition"
             autocomplete="current-password">
      <div class="flex gap-2">
        <button id="pass-btn" class="flex-1 rounded-xl bg-indigo-600 hover:bg-indigo-500 py-2.5 text-sm font-bold">Войти</button>
        <button id="pass-cancel" class="rounded-xl bg-slate-800 hover:bg-slate-700 px-4 py-2.5 text-sm font-semibold">Отмена</button>
      </div>
      <p id="pass-hint" class="text-[11px] text-slate-500"></p>
    </div>
  </div>

  <!-- Просмотр чата (режим чтения, последние 50 сообщений) -->
  <div id="view-modal" class="hidden fixed inset-0 z-40">
    <div id="view-overlay" class="absolute inset-0 bg-black/60"></div>
    <div class="absolute inset-x-0 bottom-0 top-10 bg-slate-900 rounded-t-3xl border-t border-slate-700 flex flex-col">
      <div class="flex items-center justify-between px-5 pt-4 pb-3 border-b border-slate-800">
        <h3 id="view-title" class="font-extrabold text-sm pr-3 truncate">Чат класса</h3>
        <button id="view-close" class="h-9 w-9 rounded-full bg-slate-800 flex items-center justify-center font-bold hover:bg-slate-700" aria-label="Закрыть">✕</button>
      </div>
      <div id="view-body" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
    </div>
  </div>

  <noscript><p class="p-5 text-center text-slate-400">Для работы приложения включите JavaScript.</p></noscript>

  <!-- ======================= Скрипты ======================= -->
  <!-- Конфиг Firebase заполняется в firebase-config.js (индекс v2 — для сброса старого кэша PWA) -->
  <script src="firebase-config.js?v=2"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Модули: анонимная авторизация (UID) и модерация (бан/мут по UID) -->
  <script src="auth.js?v=8"></script>
  <script src="moderation.js?v=8"></script>

  <script>
  'use strict';

  /* ============================================================
     ШКОЛЬНЫЙ ХАБ — логика приложения
     ============================================================ */

  /* ---------- Конфиг и инициализация Firebase ---------- */
  let app, db;

  // Читаем конфиг из firebase-config.js.
  // Поддерживаем оба варианта: window.firebaseConfig и глобальный const firebaseConfig
  // (const на верхнем уровне НЕ создаёт свойство window).
  function getConfig() {
    if (window.firebaseConfig) return window.firebaseConfig;
    if (typeof firebaseConfig !== 'undefined') return firebaseConfig;
    return null;
  }

  // Проверяем, заполнил ли пользователь конфиг в firebase-config.js
  function isConfigured() {
    const c = getConfig();
    return !!(c && c.apiKey && c.databaseURL && !String(c.apiKey).startsWith('YOUR_'));
  }

  function initFirebase() {
    if (app || !isConfigured()) return;
    app = firebase.initializeApp(getConfig());
    db = firebase.database();
  }

  /* ---------- Вспомогательные функции ---------- */
  const $  = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));

  // Ключи localStorage
  const LS = {
    sel: 'sh_selection',   // выбранные город/школа/класс
    nick: 'sh_nick',       // ник пользователя
    seen: 'sh_seen_ann',   // ключи объявлений, для которых уже показали toast
  };

  // Неделя: индексы JS getDay(): 0 = воскресенье
  const DAY_KEYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  const DAY_NAMES = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];

  // Состояние приложения
  const state = {
    sel: {},               // { cid, cname, sid, sname, clid, clname }
    step: 1,               // шаг экрана входа
  };

  // Админ-состояние
  const admin = {
    city: null,     // выбранный город (ключ)
    school: null,   // выбранная школа (ключ)
    cls: null,      // выбранный класс (ключ)
    ctype: 'schedule', // вкладка "содержимого": schedule | homework | announcements
    annKey: null,      // ключ объявления в режиме редактирования
    annDate: null,     // createdAt редактируемого объявления
    page: 'cities',
    authorized: sessionStorage.getItem('sh_admin_auth') === '1', // вход по паролю за сессию
  };

  // Рефы с активными слушателями
  let authRefs = [];   // экран входа
  let mainRefs = [];   // главный экран
  let adminRefs = [];  // админ-панель

  const offRefs = (arr) => arr.forEach((r) => r.off());
  const addRef = (arr, ref) => { arr.push(ref); return ref; };

  function nick() { return localStorage.getItem(LS.nick) || ''; }
  function setNick(n) { localStorage.setItem(LS.nick, n); }

  // Синхронизация профиля users/{uid}: ник и класс (класс берём из выбранного).
  // Вызывается после входа, смены ника и выбора класса.
  function ensureProfile() {
    if (!window.HubAuth || !HubAuth.uid) return;
    const s = state.sel;
    return HubAuth.syncProfile({
      nick: nick() || 'Ученик',
      class: (s && s.clname) ? s.clname : null,
    }).catch(() => {});
  }

  // SHA-256 (hex) для пароля админки. crypto.subtle работает на https и localhost.
  // Есть запасной хеш для других случаев; при проверке принимаем любой из них.
  function sHashFb(str) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return ((h2 >>> 0).toString(16).padStart(8, '0')) + ((h1 >>> 0).toString(16).padStart(8, '0'));
  }
  function sha256(str) {
    const enc = new TextEncoder().encode(str);
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      return crypto.subtle.digest('SHA-256', enc)
        .then((buf) => Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join(''));
    }
    return Promise.resolve(sHashFb(str));
  }

  /* ---------- Статистика и фильтр сообщений ---------- */

  // device_id: генерируется один раз и хранится в localStorage
  function deviceId() {
    let id = localStorage.getItem('sh_device');
    if (!id) {
      id = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : ('d_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10));
      localStorage.setItem('sh_device', id);
    }
    return id;
  }

  // Онлайн-присутствие: пишем online/{device_id}: TIMESTAMP, обновляем каждые 30 сек.
  // Один раз на устройство регистрируем его в unique/{device_id} (счётчик уникальных).
  function startPresence() {
    const id = deviceId();
    const beacon = () => db.ref('/online/' + id).set(firebase.database.ServerValue.TIMESTAMP);
    beacon();
    setInterval(beacon, 30000);
    if (!localStorage.getItem('sh_registered')) {
      db.ref('/unique/' + id).once('value', (snap) => {
        if (!snap.exists()) {
          db.ref('/unique/' + id).set(firebase.database.ServerValue.TIMESTAMP);
          localStorage.setItem('sh_registered', '1');
        }
      });
    }
  }

  // Простой фильтр по спискам слов (без ИИ). Возвращает категории нарушений.
  const BAD_WORDS = {
    'мат': ['хуй', 'хуя', 'хую', 'хуем', 'хуи', 'пизд', 'бля', 'блять', 'ебал', 'ебан', 'ебаш', 'ебать', 'выеб', 'наеб', 'сука', 'суки', 'мудак', 'муда', 'мразь', 'уёбок', 'уёбищ', 'ёб'],
    'оскорбление': ['лох', 'лошара', 'чмо', 'дебил', 'идиот', 'тупой', 'тупая', 'шлюха', 'пидор', 'пидр', 'гандон', 'козёл', 'козел', 'овца', 'сволочь', 'тварь', 'гнида', 'редиска'],
    'угроза': ['убью', 'придушу', 'задушу', 'найду тебя', 'порву', 'сломаю тебе', 'побью', 'изобью', 'порежу', 'закопаю'],
  };
  // Сообщение проверяется как подстрока (регистр не важен)
  function checkMessage(text) {
    const t = ' ' + String(text).toLowerCase() + ' ';
    const hits = [];
    Object.keys(BAD_WORDS).forEach((cat) => {
      if (BAD_WORDS[cat].some((w) => t.includes(w))) hits.push(cat);
    });
    return hits; // например ['мат', 'угроза']
  }

  /* ---------- Пути в БД ---------- */
  const P = {
    cities: () => '/cities',
    schools: (cid) => `/cities/${cid}/schools`,
    classes: (cid, sid) => `/cities/${cid}/schools/${sid}/classes`,
    classNode: (cid, sid, clid) => `/cities/${cid}/schools/${sid}/classes/${clid}`,
  };

  // Путь к текущему классу (для главного экрана)
  function curClassPath() {
    const s = state.sel;
    return P.classNode(s.cid, s.sid, s.clid);
  }

  // Преобразование snapshot в массив { key, ...val }
  // ВАЖНО: идём через snap.val(), а не snap.forEach(): forEach иногда отдаёт только часть
  // дочерних узлов (виден 1 класс из 12), а val() всегда содержит полный набор.
  function snapArr(snap) {
    const arr = [];
    const v = snap && snap.val();
    if (v && typeof v === 'object') {
      Object.keys(v).forEach((k) => {
        const it = v[k];
        if (it && typeof it === 'object') arr.push(Object.assign({ key: k }, it));
      });
    }
    return arr;
  }

  // Мини-треска (иконка "нет данных")
  function emptyNote(text) {
    return `<div class="text-center py-10 text-slate-500 text-sm fade-up"><p>${text}</p></div>`;
  }
  function spinner() {
    return `<div class="text-center py-10 text-slate-500 text-sm">Загрузка…</div>`;
  }

  // Форматирование даты/времени
  function fmtDate(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    return `${p(d.getDate())}.${p(d.getMonth() + 1)}, ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  /* ============================================================
     TOAST УВЕДОМЛЕНИЯ
     ============================================================ */
  let toastTimer = null;
  function showToast(text) {
    $('#toast-text').textContent = text;
    const t = $('#toast');
    t.classList.remove('hidden');
    t.classList.remove('toast-in');
    void t.offsetWidth; // перезапуск анимации
    t.classList.add('toast-in');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 7000);
  }
  function hideToast() {
    $('#toast').classList.add('hidden');
    clearTimeout(toastTimer);
  }

  /* ============================================================
     ПОДТВЕРЖДЕНИЕ ДЕЙСТВИЙ (вместо window.confirm)
     window.confirm() в установленном PWA/WebView может не работать,
     поэтому показываем своё окно-диалог.
     ============================================================ */
  function askConfirm(text, onYes) {
    if (!text || typeof onYes !== 'function') return;
    let el = document.getElementById('confirm-box');
    if (!el) {
      el = document.createElement('div');
      el.id = 'confirm-box';
      el.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(2,6,23,.78);display:flex;align-items:center;justify-content:center;padding:16px;';
      el.innerHTML = `
        <div class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-700 p-5 space-y-4 shadow-2xl">
          <p class="text-sm text-slate-200 leading-snug"></p>
          <div class="flex gap-2">
            <button data-ac="no" class="flex-1 rounded-xl bg-slate-700 hover:bg-slate-600 px-4 py-2.5 text-sm font-semibold text-white">Отмена</button>
            <button data-ac="yes" class="flex-1 rounded-xl bg-rose-600 hover:bg-rose-500 px-4 py-2.5 text-sm font-semibold text-white">Удалить</button>
          </div>
        </div>`;
      el.addEventListener('click', (e) => {
        const b = e.target.closest('button[data-ac]');
        if (!b) return;
        const doYes = b.dataset.ac === 'yes';
        const cb = el.__cb;
        el.remove();
        if (doYes && cb) cb();
      });
      document.body.appendChild(el);
    } else {
      document.body.appendChild(el);
    }
    el.querySelector('p').textContent = text;
    el.__cb = onYes;
  }

  /* ============================================================
     ЭКРАН ВХОДА — пошаговый выбор города / школы / класса
     ============================================================ */
  function detachAuth() { offRefs(authRefs); authRefs = []; }

  function setStepView(title, status) {
    $('#select-title').textContent = title;
    $('#select-status').textContent = status || '';
    $('#back-btn').classList.toggle('hidden', state.step === 1);
  }

  // Кнопка-элемент списка выбора
  function choiceBtn(item) {
    return `
      <button data-key="${item.key}"
        class="choice w-full flex items-center justify-between gap-3 rounded-xl bg-slate-900 border border-slate-800 px-4 py-4 text-left hover:border-indigo-500/60 active:scale-[.98] transition fade-up">
        <span class="flex-1 min-w-0">
          <span class="block font-semibold truncate">${item.name || 'Без названия'}</span>
        </span>
        <svg class="w-5 h-5 shrink-0 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
        </svg>
      </button>`;
  }

  function renderList(items, emptyText, onCb) {
    const list = $('#select-list');
    if (!items.length) { list.innerHTML = emptyNote(emptyText); return; }
    list.innerHTML = items.map(choiceBtn).join('');
    list.querySelectorAll('.choice').forEach((b) => {
      b.addEventListener('click', () => onCb(b.dataset.key, items.find((i) => i.key === b.dataset.key)));
    });
  }

  // Шаг 1. Города из cities/
  function loadCities() {
    detachAuth();
    state.step = 1;
    setStepView('Выберите город', '');
    $('#select-list').innerHTML = spinner();

    addRef(authRefs, db.ref(P.cities())).once('value', (snap) => {
      const cities = snapArr(snap);
      state.sel.cid = state.sel.cname = state.sel.sid = state.sel.sname = state.sel.clid = state.sel.clname = null;
      renderList(cities, 'Пока нет городов. Добавьте первый город в админ-панели (зажмите заголовок).', (key, it) => {
        state.sel.cid = key; state.sel.cname = it.name;
        loadSchools();
      });
    });
  }

  // Шаг 2. Школы в выбранном городе
  function loadSchools() {
    detachAuth();
    state.step = 2;
    setStepView('Выберите школу', state.sel.cname ? `Город: ${state.sel.cname}` : '');
    $('#select-list').innerHTML = spinner();

    addRef(authRefs, db.ref(P.schools(state.sel.cid))).once('value', (snap) => {
      const schools = snapArr(snap);
      state.sel.sid = state.sel.sname = state.sel.clid = state.sel.clname = null;
      renderList(schools, 'Школ в этом городе пока нет.', (key, it) => {
        state.sel.sid = key; state.sel.sname = it.name;
        loadClasses();
      });
    });
  }

  // Шаг 3. Классы в выбранной школе
  function loadClasses() {
    detachAuth();
    state.step = 3;
    setStepView('Выберите класс', `${state.sel.cname} · ${state.sel.sname}`);
    $('#select-list').innerHTML = spinner();

    addRef(authRefs, db.ref(P.classes(state.sel.cid, state.sel.sid))).once('value', (snap) => {
      const classes = snapArr(snap);
      state.sel.clid = state.sel.clname = null;
      renderList(classes, 'Классов в школе пока нет.', (key, it) => {
        state.sel.clid = key; state.sel.clname = it.name;
        saveSelection();
        showMainScreen();
      });
    });
  }

  // Сохраняем выбор в localStorage, чтобы при следующем заходе открывался класс сразу
  function saveSelection() {
    localStorage.setItem(LS.sel, JSON.stringify(state.sel));
  }
  function loadSelection() {
    try { state.sel = JSON.parse(localStorage.getItem(LS.sel)) || {}; } catch (e) { state.sel = {}; }
  }

  // Кнопка «Сменить» — сброс выбора и выход на экран входа
  function resetSelection() {
    detachMain();
    state.sel = { cid: null, cname: null, sid: null, sname: null, clid: null, clname: null };
    saveSelection();
    showAuth();
  }

  // Кнопка «Назад» на экране выбора
  function onBack() {
    if (state.step === 3) loadSchools();
    else if (state.step === 2) loadCities();
  }

  function showAuth() {
    $('#auth-screen').classList.remove('hidden');
    $('#main-screen').classList.add('hidden');
    if (!isConfigured()) {
      const c = getConfig();
      let why = 'не загрузился файл firebase-config.js';
      if (c) {
        if (!c.apiKey) why = 'в конфиге нет apiKey';
        else if (String(c.apiKey).startsWith('YOUR_')) why = 'apiKey остался заглушкой (YOUR_...)';
        if (!c.databaseURL) why += ', нет databaseURL';
      }
      $('#select-list').innerHTML = emptyNote(
        `Файл firebase-config.js: ${why}.<br>Проверьте конфиг и обновите страницу (Ctrl+F5).`
      );
      return;
    }
    loadCities();
  }

  /* ============================================================
     ГЛАВНЫЙ ЭКРАН
     ============================================================ */
  function detachMain() { offRefs(mainRefs); mainRefs = []; clearChatPoll(); }

  // Обновляем подзаголовок и убираем прослушку "своего" прошлого класса
  function showMainScreen() {
    const s = state.sel;
    $('#header-text').textContent = `${s.cname}, ${s.sname}, ${s.clname}`;
    $('#auth-screen').classList.add('hidden');
    $('#main-screen').classList.remove('hidden');
    showSettingsTab(admin.authorized); // вкладка «Настройки» видна только администратору
    switchTab('schedule');
    loadMainData();
    askNickIfNeeded();
    $('#chat-nick').textContent = nick() || 'Ученик';
    ensureProfile(); // профиль: ник + класс (при наличии авторизации)
  }

  // Подписки на данные текущего класса
  function loadMainData() {
    detachMain();
    const root = db.ref(curClassPath());

    // Расписание
    addRef(mainRefs, root.child('schedule')).on('value', renderSchedule);
    // Домашка
    addRef(mainRefs, root.child('homework')).on('value', renderHomework);
    // Объявления (лента)
    addRef(mainRefs, root.child('announcements')).on('value', renderAnnouncements);
    // Объявления (только новые — для toast)
    addRef(mainRefs, root.child('announcements')).on('child_added', onNewAnnouncement);
    // Чат
    addRef(mainRefs, root.child('chat')).on('child_added', onChatMessage);
    addRef(mainRefs, root.child('chat')).on('child_removed', (snap) => forgetMsg(snap.key));
    // Чат: гарантированная полная отрисовка + страховочный поллинг (on-события ненадёжны)
    refreshChat();
    startChatPoll();
  }

  /* ---------- Уведомление: «Завтра контрольная» ---------- */
  let seenSet = new Set();
  function initSeen() {
    try { seenSet = new Set(JSON.parse(localStorage.getItem(LS.seen) || '[]')); } catch (e) { seenSet = new Set(); }
  }
  function persistSeen() {
    try { localStorage.setItem(LS.seen, JSON.stringify(Array.from(seenSet))); } catch (e) {}
  }
  const CTRL_RE = /завтра\s+контрольн/iu;

  function onNewAnnouncement(snap) {
    const a = snap.val();
    if (!a || !a.text) return;
    const already = seenSet.has(snap.key);
    seenSet.add(snap.key);
    persistSeen();
    // Уведомление показываем только для НОВЫХ записей со словом «Завтра контрольная»
    if (!already && CTRL_RE.test(a.text)) showToast(a.text);
  }

  /* ---------- Вкладки ---------- */
  function switchTab(name) {
    $$('.tab-btn').forEach((b) => {
      const active = b.dataset.tab === name;
      b.classList.toggle('text-indigo-400', active);
      b.classList.toggle('bg-indigo-500/10', active);
      b.classList.toggle('text-slate-400', !active);
    });
    $$('.tab').forEach((sec) => sec.classList.add('hidden'));
    const target = $('#tab-' + name);
    target.classList.remove('hidden');
    target.querySelectorAll('.fade-up').forEach((el) => el.classList.add('fade-up'));
    if (name === 'chat') refreshChat();
    if (name === 'settings') renderSettingsTab();
  }

  /* ---------- Расписание: сегодня и завтра ---------- */
  function renderSchedule(snap) {
    const data = snap.val() || {};
    const todayIdx = new Date().getDay();
    const tomorrowIdx = (todayIdx + 1) % 7;
    const days = [
      { key: DAY_KEYS[todayIdx], title: 'Сегодня', dayName: DAY_NAMES[todayIdx] },
      { key: DAY_KEYS[tomorrowIdx], title: 'Завтра', dayName: DAY_NAMES[tomorrowIdx] },
    ];
    const el = $('#tab-schedule');
    el.innerHTML = days.map((d) => {
      const lessons = Array.isArray(data[d.key]) ? data[d.key] : [];
      const inner = lessons.length
        ? lessons.map((l, i) => `
            <li class="flex items-center gap-3 px-1">
              <span class="shrink-0 w-7 h-7 rounded-full bg-indigo-500/15 text-indigo-400 text-xs font-bold flex items-center justify-center">${i + 1}</span>
              <span class="flex-1 text-sm">${l}</span>
            </li>`).join('')
        : '<li class="text-sm text-slate-500 px-1">Уроков нет 😌</li>';
      return `
        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 fade-up">
          <h3 class="font-bold text-sm mb-3">${d.title} · ${d.dayName}</h3>
          <ul class="space-y-2.5">${inner}</ul>
        </div>`;
    }).join('');
  }

  /* ---------- Домашка ---------- */
  function renderHomework(snap) {
    const hw = snap.val() || {};
    const entries = Object.entries(hw).sort((a, b) => a[0].localeCompare(b[0], 'ru'));
    const el = $('#tab-homework');
    if (!entries.length) {
      el.innerHTML = emptyNote('Домашки нет 🎉');
      return;
    }
    el.innerHTML = entries.map(([subj, task]) => `
      <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 fade-up">
        <div class="flex items-center gap-2 mb-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
          <h4 class="font-bold text-sm">${subj}</h4>
        </div>
        <p class="text-sm text-slate-300 whitespace-pre-wrap break-words">${task || '—'}</p>
      </div>`).join('');
  }

  /* ---------- Объявления ---------- */
  function renderAnnouncements(snap) {
    const items = snapArr(snap).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const el = $('#tab-announcements');
    if (!items.length) {
      el.innerHTML = emptyNote('Объявлений пока нет');
      return;
    }
    // Подсветка объявлений про контрольную
    el.innerHTML = items.map((a) => {
      const isCtrl = CTRL_RE.test(a.text || '');
      return `
        <div class="rounded-2xl p-4 border fade-up ${isCtrl ? 'bg-amber-500/10 border-amber-500/40' : 'bg-slate-900 border-slate-800'}">
          <p class="text-sm whitespace-pre-wrap break-words ${isCtrl ? 'text-amber-200 font-semibold' : 'text-slate-200'}">${a.text}</p>
          <p class="text-[11px] text-slate-500 mt-2">${fmtDate(a.createdAt)}</p>
        </div>`;
    }).join('');
  }

  /* ---------- Чат: реального времени через Firebase ---------- */
  const nickColor = (n) => {
    const hue = (n.split('').reduce((a, c) => a + c.charCodeAt(0), 0) * 37) % 360;
    return `hsl(${hue},70%,70%)`;
  };

  // Вставка сообщения по времени (а не в конец): иначе опоздавшие события
  // притворяются самыми свежими и вызывают иллюзию дубликатов.
  function nodeTime(el) { return parseInt(el.getAttribute('data-time') || '0', 10) || 0; }
  function insertSorted(div) {
    const box = $('#chat-messages');
    const t = nodeTime(div);
    const kids = box.children;
    let i = kids.length - 1;
    while (i >= 0 && nodeTime(kids[i]) > t) i--;
    if (i < 0) box.insertBefore(div, box.firstChild);
    else if (i < kids.length - 1) box.insertBefore(div, kids[i].nextSibling);
    else box.appendChild(div);
  }

  function onChatMessage(snap) {
    const m = snap.val();
    if (!m || !m.text) return;
    const key = snap.key;
    const box = $('#chat-messages');
    if (box.querySelector('[data-msg="' + key + '"]')) return; // уже нарисовано (поллинг/перерисовка)
    const me = nick();
    const mname = m.nick || m.name || 'Ученик';
    const div = document.createElement('div');
    const mine = mname === me;
    const canDel = admin.authorized && altMode(); // альт-менедж: удаление любых сообщений
    div.className = `flex ${mine ? 'justify-end' : 'justify-start'} fade-up`;
    div.setAttribute('data-msg', key);
    div.setAttribute('data-time', String(m.time || 0));
    div.innerHTML = `
      <div class="${mine ? 'bg-indigo-600' : 'bg-slate-800'} rounded-2xl px-3.5 py-2 max-w-[80%]">
        <div class="flex items-center gap-2 mb-0.5">
          <div class="text-[11px] font-bold" style="color:${mine ? '#c7d2fe' : nickColor(mname)}">${mname}</div>
          ${canDel ? `<button class="msg-del text-[10px] opacity-70 hover:opacity-100 px-1 -mr-1 rounded ${mine ? 'text-indigo-200' : 'text-slate-300'}" title="Удалить">✕</button>` : ''}
        </div>
        <p class="text-sm break-words whitespace-pre-wrap">${m.text}</p>
        <div class="text-[10px] opacity-60 mt-1 text-right">${fmtDate(m.time || Date.now())}</div>
      </div>`;
    insertSorted(div);
    chatMaxCount = Math.max(chatMaxCount, box.querySelectorAll('[data-msg]').length);
    scrollChat();
  }

  // Максимум когда-либо отрисованных сообщений. Используется, чтобы не
  //  "ужать" чат до частичного снапшота (once('value') иногда приходит неполным).
  let chatMaxCount = 0;
  let chatFetchBusy = false;

  // Полная пересборка чата из полного снапшота
  function renderChat(items) {
    const box = $('#chat-messages');
    if (items.length < chatMaxCount) return false; // частичный снапшот — не перерисовываем меньше
    box.innerHTML = '';
    chatMaxCount = Math.max(chatMaxCount, items.length);
    items
      .sort((a, b) => (a.time || 0) - (b.time || 0))
      .forEach((m) => onChatMessage({ key: m.key, val: () => m }));
    if (!$('#tab-chat').classList.contains('hidden')) scrollChat();
    return true;
  }

  // Пересборка чата (например, после смены альт-менедж режима).
  //  ЗАЩИТА от частичных снапшотов:
  //   1) если снапшот меньше уже отрисованного — переспрашиваем (до 3 попыток);
  //   2) после первой отрисовки через 1.2с делаем контрольный запрос: если в нём
  //      больше сообщений — перерисовываем (чатик "подрастает", но не ужимается).
  function refreshChat(tries) {
    if (chatFetchBusy) { setTimeout(() => refreshChat(tries || 0), 800); return; }
    chatFetchBusy = true;
    const path = curClassPath();
    db.ref(path + '/chat').once('value', (snap) => {
      chatFetchBusy = false;
      if (curClassPath() !== path || renderChat(snapArr(snap))) return;
      if ((tries || 0) < 3) setTimeout(() => refreshChat((tries || 0) + 1), 1500);
    }, (err) => {
      chatFetchBusy = false;
      showToast('Ошибка чата: ' + (err && err.message ? err.message : err));
    });
    // Контрольный запрос: ловим случай, когда сам первый снапшот был частичным
    setTimeout(() => {
      if (curClassPath() !== path || chatFetchBusy) return;
      chatFetchBusy = true;
      db.ref(path + '/chat').once('value', (snap) => {
        chatFetchBusy = false;
        if (curClassPath() !== path) return;
        const v = snapArr(snap);
        if (v.length > chatMaxCount) renderChat(v);
      });
    }, 1200);
  }

  let chatPollTimer = null;
  function startChatPoll() { clearChatPoll(); chatPollTimer = setInterval(pollChat, 12000); }
  function clearChatPoll() { if (chatPollTimer) { clearInterval(chatPollTimer); chatPollTimer = null; } }

  // Страховка: если живые события не пришли, сверим полные снапшоты раз в 12 сек.
  //  «Растём» (новые сообщения) и аккуратно лечим одиночные удаления:
  //  ужимать чат до частичного снапшота нельзя.
  function pollChat() {
    const tab = $('#tab-chat');
    if (!tab || tab.classList.contains('hidden') || chatFetchBusy) return;
    chatFetchBusy = true;
    db.ref(curClassPath() + '/chat').once('value', (snap) => {
      chatFetchBusy = false;
      const remote = snapArr(snap);
      const remoteKeys = new Set(remote.map((m) => m.key));
      const nodes = $('#chat-messages').querySelectorAll('[data-msg]');
      const localKeys = new Set(Array.from(nodes).map((n) => n.dataset.msg));
      const hasNew = [...remoteKeys].some((k) => !localKeys.has(k));
      if (hasNew && remote.length >= chatMaxCount) { renderChat(remote); return; }
      // Одиночное удаление (нет новых ключей, в БД ровно на один меньше)
      if (!hasNew && remoteKeys.size === localKeys.size - 1) {
        const gone = [...localKeys].find((k) => !remoteKeys.has(k));
        if (gone) forgetMsg(gone);
      }
    });
  }

  function forgetMsg(key) {
    const box = $('#chat-messages');
    const el = box.querySelector('[data-msg="' + key + '"]');
    if (el) el.remove();
    chatMaxCount = box.querySelectorAll('[data-msg]').length;
  }

  function scrollChat() {
    const box = $('#chat-messages');
    box.scrollTop = box.scrollHeight;

  function sendMessage(e) {
    e.preventDefault();
    const input = $('#chat-input');
    const text = input.value.trim();
    if (!text) return;
    if (!nick()) { showToast('Сначала задайте ник'); askNickIfNeeded(); return; }
    if (!HubAuth.uid || !HubAuth.ready) { showToast('Авторизация ещё не готова, попробуйте снова'); return; }
    const me = nick();
    // Проверяем бан/мут по UID (сменой ника это не обойти)
    HubModeration.checkCanSend((err) => {
      if (err) { showToast(err); return; }
      ensureProfile();
      // Автофильтр: мат / оскорбление / угроза. Сообщение НЕ удаляем — помечаем флагом.
      const reasons = checkMessage(text);
      const s = state.sel;
      const msg = { uid: HubAuth.uid, nick: me, text, time: Date.now(), class: (s && s.clname) || '' };
      if (reasons.length) msg.flagged = true;
      const cref = db.ref(curClassPath() + '/chat').push(msg);
      if (reasons.length) {
        // Отдельно сохраняем в ветку flagged_messages для раздела «Интересное»
        db.ref('/flagged_messages/' + s.cid + '/' + s.sid + '/' + s.clid + '/' + cref.key)
          .set({
            uid: HubAuth.uid,
            nick: me,
            text,
            time: Date.now(),
            reason: reasons.join(', '),
            cityName: s.cname,
            schoolName: s.sname,
            className: s.clname,
          })
          .catch((err2) => showToast('Ошибка: ' + (err2.message || err2)));
      }
    });
    input.value = '';
    setTimeout(refreshChat, 500); // гарантированный показ своего сообщения
  }

  // Долгое нажатие (3 секунды) — таймер
  function bindLongPress(el, cb) {
    let timer = null;
    const start = () => {
      timer = setTimeout(() => {
        timer = null;
        el.classList.add('hold');
        cb();
      }, 3000);
    };
    const stop = (e) => {
      clearTimeout(timer);
      timer = null;
      el.classList.remove('hold');
    };
    el.addEventListener('pointerdown', start);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => el.addEventListener(ev, stop));
  }

  // N тапов по элементу в течение 2 секунд
  function bindNTaps(el, n, cb) {
    let count = 0, timer = null;
    el.addEventListener('click', () => {
      count++;
      clearTimeout(timer);
      timer = setTimeout(() => { count = 0; }, 2000);
      if (count >= n) { count = 0; cb(); }
    });
  }
