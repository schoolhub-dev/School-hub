      if (admin.city && cities.some((c) => c.key === admin.city)) sel.value = admin.city;
      const cid = sel.value;
      if (!cid) { loadedCid = null; renderList(); return; }
      if (cid !== loadedCid) loadSchools();
      else renderList();
    });

    $('#class-city').addEventListener('change', loadSchools);
    $('#class-school').addEventListener('change', () => {
      admin.school = $('#class-school').value || null;
      renderList();
    });

    $('#class-add').addEventListener('submit', (e) => {
      e.preventDefault();
      const cid = $('#class-city').value, sid = $('#class-school').value;
      const name = $('#class-name').value.trim();
      if (!cid || !sid || !name) { showToast('Выберите город и школу, введите класс'); return; }
      db.ref(P.classes(cid, sid)).push({ name })
        .then(() => { $('#class-name').value = ''; renderList(); showToast('Класс «' + name + '» добавлен'); })
        .catch((err) => showToast('Ошибка сохранения: ' + (err.message || err)));
    });
  }

  /* ---------- Люди и чат: блокировки и удаление сообщений ---------- */
  function renderAdminPeople(body) {
    body.innerHTML = `
      <p class="text-xs text-slate-500 mb-3">Модерация привязана к аккаунту (UID), а не к нику: бан/мут нельзя обойти сменой ника. Пользователи берутся из ветки users.</p>
      <div class="space-y-3 mb-4">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Город</label>
          <select id="people-city" class="${aInput('w-full')}"></select>
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Школа</label>
          <select id="people-school" class="${aInput('w-full')}"></select>
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Класс</label>
          <select id="people-class" class="${aInput('w-full')}"></select>
        </div>
      </div>
      <div id="people-list"></div>`;

    const selCity = $('#people-city'), selSchool = $('#people-school'), selClass = $('#people-class');
    const list = $('#people-list');

    const loadPeople = () => {
      const cid = selCity.value, sid = selSchool.value, clid = selClass.value;
      if (!cid || !sid || !clid) { list.innerHTML = emptyNote('Выберите город, школу и класс'); return; }
      list.innerHTML = spinner();
      const node = db.ref(P.classNode(cid, sid, clid));
      node.child('chat').once('value', (chatSnap) => {
        const chat = chatSnap.val() || {};
        // Сообщения: последние 100 по времени
        const msgs = Object.keys(chat).map((k) => Object.assign({ key: k }, chat[k]))
          .filter((m) => m && m.text)
          .sort((a, b) => (b.time || 0) - (a.time || 0))
          .slice(0, 100);
        // Имя выбранного класса (фильтрация списка users по полю class)
        const opt = selClass.selectedOptions && selClass.selectedOptions[0];
        const clname = (opt && opt.value) ? opt.textContent.trim() : '';
        // Пользователи берутся из ветки users (привязка к UID, а не к нику)
        db.ref('/users').once('value', (us) => {
          const users = [];
          const uv = us.val() || {};
          Object.keys(uv).forEach((uid) => {
            const prof = Object.assign({ uid }, uv[uid] || {});
            if (clname && prof.class !== clname) return; // только пользователи выбранного класса
            const cnt = msgs.filter((m) =>
              (m.uid === uid) || (!m.uid && (m.nick || m.name) === (prof.nick || ''))).length;
            prof.msgCount = cnt;
            users.push(prof);
          });
          users.sort((a, b) => (b.msgCount || 0) - (a.msgCount || 0));

          list.innerHTML = `
            <div class="text-xs text-slate-400 font-bold mb-2">Пользователи класса (${esc(String(users.length))})</div>
            <div class="space-y-2 mb-6">${users.length ? users.map((u) => {
              const st = HubModeration.statusOf(u);
              const nme = u.nick || 'Ученик';
              const isBanned = !!u.banned;
              const isRestricted = !!u.banned || (u.mutedUntil && Number(u.mutedUntil) > Date.now());
              return `
              <div class="rounded-xl bg-slate-900 border border-slate-800 p-3 flex flex-col gap-2 sm:flex-row sm:items-center fade-up ${isBanned ? 'opacity-70' : ''}">
                <div class="flex-1 min-w-0">
                  <div class="font-semibold text-sm truncate" style="color:${nickColor(nme)}">${esc(nme)}</div>
                  <div class="text-[11px] text-slate-500">
                    <span class="${esc(st.cls)}">${esc(st.label)}</span>
                    ${u.class ? ' · ' + esc(u.class) : ''} · ${u.msgCount} сообщ.
                  </div>
                  <div class="text-[10px] text-slate-600 break-all">${esc(u.uid)}</div>
                </div>
                <div class="flex gap-2 shrink-0 flex-wrap">
                  <button data-act="mute1" data-uid="${esc(u.uid)}" class="${aBtn('bg-amber-600 hover:bg-amber-500')}">Мут 1 час</button>
                  <button data-act="mute24" data-uid="${esc(u.uid)}" class="${aBtn('bg-amber-600 hover:bg-amber-500')}">Мут 24 часа</button>
                  <button data-act="banForever" data-uid="${esc(u.uid)}" class="${aBtn('bg-rose-600 hover:bg-rose-500')}">Бан навсегда</button>
                  ${isRestricted ? `<button data-act="unban" data-uid="${esc(u.uid)}" class="${aBtn('bg-emerald-600 hover:bg-emerald-500')}">Разблокировать</button>` : ''}
                  <button data-act="purgeUser" data-uid="${esc(u.uid)}" data-nick="${esc(nme)}" class="${aBtn('bg-rose-600/70 hover:bg-rose-500')}">Удалить сообщения</button>
                </div>
              </div>`; }).join('') : emptyNote('Пользователей этого класса пока нет')}</div>
            <div class="text-xs text-slate-400 font-bold mb-2">Последние сообщения (${esc(String(msgs.length))})</div>
            <div class="space-y-2">${msgs.length ? msgs.map((m) => `
              <div class="rounded-xl bg-slate-900 border border-slate-800 p-3 fade-up">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-[11px] font-bold" style="color:${nickColor(m.nick || m.name || '?')}">${esc(m.nick || m.name || 'Ученик')}</span>
                  <span class="text-[10px] text-slate-500">${fmtDate(m.time)}</span>
                  <button data-act="delMsg" data-key="${esc(m.key)}" class="ml-auto ${aBtn('bg-rose-600/80 hover:bg-rose-500')}">Удалить</button>
                </div>
                <p class="text-sm break-words whitespace-pre-wrap">${esc(m.text)}</p>
              </div>`).join('') : emptyNote('Сообщений нет')}</div>`;
        }).catch(() => { list.innerHTML = emptyNote('Не удалось загрузить список пользователей'); });
      });
    };

    // Города → школы → классы. Сохраняем выбор города/школы/класса между вкладками.
    const fillSchools = (keepSid) => {
      selSchool.innerHTML = '<option value="">— школа —</option>';
      selClass.innerHTML = '<option value="">— класс —</option>';
      const cid = selCity.value;
      if (!cid) { admin.school = admin.cls = null; loadPeople(); return; }
      db.ref(P.schools(cid)).once('value', (ss) => {
        const schools = snapArr(ss);
        selSchool.innerHTML = '<option value="">— школа —</option>' + schools.map((s) => `<option value="${esc(s.key)}">${esc(s.name || '')}</option>`).join('');
        if (keepSid && schools.some((s) => s.key === keepSid)) {
          selSchool.value = keepSid;
          fillClasses(keepSid, admin.cls);
        } else {
          admin.school = admin.cls = null;
          loadPeople();
        }
      });
    };
    const fillClasses = (sid, keepClid) => {
      selClass.innerHTML = '<option value="">— класс —</option>';
      if (!sid) { admin.cls = null; loadPeople(); return; }
      db.ref(P.classes(admin.city, sid)).once('value', (cs) => {
        const classes = snapArr(cs);
        selClass.innerHTML = '<option value="">— класс —</option>' + classes.map((c) => `<option value="${esc(c.key)}">${esc(c.name || '')}</option>`).join('');
        if (keepClid && classes.some((c) => c.key === keepClid)) { selClass.value = keepClid; admin.cls = keepClid; }
        else admin.cls = null;
        loadPeople();
      });
    };

    addRef(adminRefs, db.ref(P.cities())).on('value', (snap) => {
      const cities = snapArr(snap);
      selCity.innerHTML = '<option value="">— город —</option>' + cities.map((c) => `<option value="${esc(c.key)}">${esc(c.name || '')}</option>`).join('');
      if (admin.city && cities.some((c) => c.key === admin.city)) selCity.value = admin.city;
      fillSchools(admin.school);
    });
    selCity.addEventListener('change', () => {
      admin.city = selCity.value || null;
      admin.school = admin.cls = null;
      fillSchools();
    });
    selSchool.addEventListener('change', () => {
      admin.school = selSchool.value || null;
      admin.cls = null;
      fillClasses(admin.school);
    });
    selClass.addEventListener('change', () => { admin.cls = selClass.value || null; loadPeople(); });
  }

  /* ---------- Статистика: счётчики, активность, «Интересное» ---------- */
  function openClassChat(cid, sid, clid, title) {
    const m = $('#view-modal');
    m.classList.remove('hidden');
    $('#view-title').textContent = 'Чат: ' + (title || '');
    const body = $('#view-body');
    body.innerHTML = spinner();
    db.ref('/cities/' + cid + '/schools/' + sid + '/classes/' + clid + '/chat').once('value', (snap) => {
      const items = snapArr(snap);
      items.sort((a, b) => (a.time || 0) - (b.time || 0));
      const last = items.slice(-50);
      body.innerHTML = last.length ? last.map((m2) => {
        const fl = m2.flagged;
        return `
          <div class="rounded-2xl bg-slate-800 px-3.5 py-2">
            <div class="text-[11px] font-bold mb-0.5" style="color:${nickColor(m2.name || '?')}">${esc(m2.name || 'Ученик')}${fl ? ' <span class="text-amber-400">· помечено</span>' : ''}</div>
            <p class="text-sm break-words whitespace-pre-wrap ${fl ? 'text-amber-200' : ''}">${esc(m2.text || '')}</p>
            <div class="text-[10px] opacity-60 mt-1 text-right">${fmtDate(m2.time)}</div>
          </div>`;
      }).join('') : emptyNote('В этом чате пока нет сообщений');
    });
  }

  function renderAdminStats(body) {
    body.innerHTML = `
      <p class="text-xs text-slate-500 mb-3">Общая статистика базы и помеченные фильтром сообщения.</p>
      <div id="stats-cards" class="grid grid-cols-3 gap-2 mb-4">${spinner()}</div>
      <div class="text-xs text-slate-400 font-bold mb-2">Классы и активность (сообщения за последние 24 ч)</div>
      <div id="stats-classes" class="space-y-2 mb-5">${spinner()}</div>
      <div class="text-xs text-slate-400 font-bold mb-2">Интересное (помеченные сообщения)</div>
      <div id="stats-flagged" class="space-y-2">${spinner()}</div>`;

    const cardsEl = $('#stats-cards');
    const classesEl = $('#stats-classes');
    const flaggedEl = $('#stats-flagged');
    const DAY24 = 24 * 60 * 60 * 1000;
    const NOW = Date.now();

    // Счётчики + активные классы (одним глубоким чтением /cities)
    db.ref('/cities').once('value', (cs) => {
      let cities = 0, schools = 0, classes = 0, classesRows = [];
      const cv = cs.val() || {};
      Object.keys(cv).forEach((cid) => {
        cities++;
        const cVal = cv[cid] || {};
        const cName = cVal.name || '';
        const schV = cVal.schools || {};
        Object.keys(schV).forEach((sid) => {
          schools++;
          const sVal = schV[sid] || {};
          const sName = sVal.name || '';
          const clsV = sVal.classes || {};
          Object.keys(clsV).forEach((clid) => {
            classes++;
            const clVal = clsV[clid] || {};
            const clName = clVal.name || '';
            const chatV = clVal.chat || {};
            let msgs24 = 0;
            Object.keys(chatV).forEach((mgId) => {
              const mt = (chatV[mgId] && chatV[mgId].time) || 0;
              if (mt >= NOW - DAY24) msgs24++;
            });
            classesRows.push({
              name: `${cName}, ${sName}, ${clName}`,
              msgs: msgs24,
              cid, sid, clid,
            });
          });
        });
      });
      classesRows.sort((a, b) => b.msgs - a.msgs);
      const statCell = (title, val, clsExtra) => `
        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-3">
          <div class="text-2xl font-extrabold ${clsExtra || ''}">${val}</div>
          <div class="text-[11px] text-slate-500 mt-0.5">${esc(title)}</div>
        </div>`;
      cardsEl.innerHTML = statCell('Города', cities) + statCell('Школы', schools) + statCell('Классы', classes) + `
        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-3">
          <div class="text-2xl font-extrabold text-emerald-400" id="stat-online">…</div>
          <div class="text-[11px] text-slate-500 mt-0.5">Онлайн (5 мин)</div>
        </div>
        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-3">
          <div class="text-2xl font-extrabold text-indigo-300" id="stat-unique">…</div>
          <div class="text-[11px] text-slate-500 mt-0.5">Уникальных всего</div>
        </div>`;
      classesEl.innerHTML = classesRows.length ? classesRows.map((a) => `
        <div class="rounded-xl bg-slate-900 border border-slate-800 p-3 flex items-center justify-between gap-2">
          <div class="text-sm font-semibold min-w-0 truncate">${esc(a.name)}</div>
          ${a.msgs > 0
            ? `<div class="shrink-0 text-[11px] text-indigo-300 font-bold">${a.msgs} сообщ.</div>`
            : '<div class="shrink-0 text-[11px] text-slate-600 font-semibold">без сообщений</div>'}
        </div>`).join('') : emptyNote('Классов пока нет');

      // Онлайн (в пределах 5 минут) и уникальные пользователи
      db.ref('/online').once('value', (os) => {
        let online = 0;
        const ov = os.val() || {};
        Object.keys(ov).forEach((k) => {
          const v = ov[k];
          if (typeof v === 'number' && v >= Date.now() - 5 * 60 * 1000) online++;
        });
        const el = $('#stat-online');
        if (el) el.textContent = String(online);
      });
      db.ref('/unique').once('value', (us) => {
        const el = $('#stat-unique');
        if (el) el.textContent = String(us.numChildren());
      });
    });

    // «Интересное» — все помеченные сообщения
    db.ref('/flagged_messages').once('value', (fs) => {
      const flags = [];
      const fv = fs.val() || {};
      Object.keys(fv).forEach((cid) => {
        const sv = fv[cid] || {};
        Object.keys(sv).forEach((sid) => {
          const clv = sv[sid] || {};
          Object.keys(clv).forEach((clid) => {
            const mv = clv[clid] || {};
            Object.keys(mv).forEach((key) => {
              flags.push({ cid, sid, clid, key, d: mv[key] });
            });
          });
        });
      });
      flags.sort((a, b) => ((b.d && b.d.time) || 0) - ((a.d && a.d.time) || 0));
      flaggedEl.innerHTML = flags.length ? flags.map((f) => `
        <div class="rounded-xl bg-slate-900 border border-amber-500/30 p-3 fade-up">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-[11px] font-bold text-amber-300">${esc((f.d && f.d.reason) || 'помечено')}</span>
            <span class="text-[10px] text-slate-500 ml-auto">${fmtDate(f.d && f.d.time)}</span>
          </div>
          <p class="text-sm break-words whitespace-pre-wrap">${esc((f.d && f.d.text) || '')}</p>
          <p class="text-[11px] text-slate-500 mt-1">${esc((f.d && f.d.cityName) || '?')}, ${esc((f.d && f.d.schoolName) || '?')}, ${esc((f.d && f.d.className) || '?')} · ${esc((f.d && f.d.name) || '?')}</p>
          <div class="flex flex-wrap gap-2 mt-2">
            <button data-act="flagOpen" data-cid="${esc(f.cid)}" data-sid="${esc(f.sid)}" data-clid="${esc(f.clid)}"
                    data-cname="${esc((f.d && f.d.cityName) || '')}" data-sname="${esc((f.d && f.d.schoolName) || '')}" data-clname="${esc((f.d && f.d.className) || '')}"
                    class="${aBtn('bg-sky-600 hover:bg-sky-500')}">Открыть чат</button>
            <button data-act="flagIgnore" data-cid="${esc(f.cid)}" data-sid="${esc(f.sid)}" data-clid="${esc(f.clid)}" data-key="${esc(f.key)}"
                    class="${aBtn('bg-slate-700 hover:bg-slate-600')}">Игнорировать</button>
            <button data-act="flagDel" data-cid="${esc(f.cid)}" data-sid="${esc(f.sid)}" data-clid="${esc(f.clid)}" data-key="${esc(f.key)}"
                    class="${aBtn('bg-rose-600 hover:bg-rose-500')}">Удалить сообщение</button>
          </div>
        </div>`).join('') : emptyNote('Помеченных сообщений нет');
    });
  }

  /* ---------- Содержимое класса: расписание / домашка / объявления ---------- */
  function renderAdminContent(body) {
    body.innerHTML = `
      <p class="text-xs text-slate-500 mb-3">Выберите класс, для которого хотите изменить данные.</p>
      <div class="space-y-3 mb-4">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Город</label>
          <select id="cont-city" class="${aInput('w-full')}"></select>
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Школа</label>
          <select id="cont-school" class="${aInput('w-full')}"></select>
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Класс</label>
          <select id="cont-class" class="${aInput('w-full')}"></select>
        </div>
      </div>
      <div id="cont-editor"></div>`;

    const editor = $('#cont-editor');
    const selCity = $('#cont-city'), selSchool = $('#cont-school'), selClass = $('#cont-class');

    // Подвкладки редактора
    const subNav = () => `
      <div class="grid grid-cols-3 gap-1 px-1 py-2 mb-3 bg-slate-800/50 rounded-xl">
        <button data-ctype="schedule" class="ctype-btn py-2 rounded-lg text-[11px] font-semibold ${admin.ctype === 'schedule' ? 'bg-indigo-600 text-white' : 'text-slate-400'}">Расписание</button>
        <button data-ctype="homework" class="ctype-btn py-2 rounded-lg text-[11px] font-semibold ${admin.ctype === 'homework' ? 'bg-indigo-600 text-white' : 'text-slate-400'}">Домашка</button>
        <button data-ctype="announcements" class="ctype-btn py-2 rounded-lg text-[11px] font-semibold ${admin.ctype === 'announcements' ? 'bg-indigo-600 text-white' : 'text-slate-400'}">Объявления</button>
      </div>`;

    const loadEditor = () => {
      offRefs(adminRefs); adminRefs = [];
      if (!admin.city || !admin.school || !admin.cls) { editor.innerHTML = emptyNote('Выберите город, школу и класс'); return; }
      const node = db.ref(P.classNode(admin.city, admin.school, admin.cls));

      if (admin.ctype === 'schedule') {
        editor.innerHTML = subNav() + scheduleEditorForm();
        $$('.ctype-btn').forEach((b) => b.addEventListener('click', () => { admin.ctype = b.dataset.ctype; loadEditor(); }));
        // Заполняем поля из БД и вешаем сохранение
        editor.querySelector('#sch-save').addEventListener('click', () => {
          const data = {};
          DAY_KEYS.forEach((d) => {
            const ta = editor.querySelector('#sch-' + d);
            data[d] = ta.value.split('\n').map((s) => s.replace(/\r/g, '').trim()).filter(Boolean);
          });
          node.child('schedule').set(data);
          showToast('Расписание сохранено');
        });
        editor.querySelector('#sch-clear').addEventListener('click', () => {
          askConfirm('Очистить всё расписание?', () => {
            node.child('schedule').remove().then(() => showToast('Расписание очищено')).catch((err) => showToast('Ошибка: ' + (err.message || err)));
          });
        });
        addRef(adminRefs, node.child('schedule')).on('value', (snap) => {
          const s = snap.val() || {};
          DAY_KEYS.forEach((d) => {
            const ta = editor.querySelector('#sch-' + d);
            if (ta) ta.value = Array.isArray(s[d]) ? s[d].join('\n') : '';
          });
        });
      }
      else if (admin.ctype === 'homework') {
        editor.innerHTML = subNav() + homeworkEditorForm();
        $$('.ctype-btn').forEach((b) => b.addEventListener('click', () => { admin.ctype = b.dataset.ctype; loadEditor(); }));
        editor.querySelector('#hw-add').addEventListener('click', () => {
          const s = editor.querySelector('#hw-new-subj').value.trim();
          const t = editor.querySelector('#hw-new-task').value;
          if (!s) { showToast('Введите предмет'); return; }
          node.child('homework/' + s).set(t);
          editor.querySelector('#hw-new-subj').value = '';
          editor.querySelector('#hw-new-task').value = '';
        });
        addRef(adminRefs, node.child('homework')).on('value', (snap) => {
          const hw = snap.val() || {};
          const entries = Object.entries(hw).sort((a, b) => a[0].localeCompare(b[0], 'ru'));
          const wrap = editor.querySelector('#hw-list');
          wrap.innerHTML = entries.length ? entries.map(([subj, task]) => `
            <div class="row rounded-xl bg-slate-900 border border-slate-800 p-3 space-y-2 fade-up">
              <input data-hw-key="${esc(subj)}" value="${esc(subj)}" placeholder="Предмет" class="${aInput('w-full font-semibold')}">
              <textarea data-hw-task rows="2" placeholder="Задание" class="${aInput('w-full resize-none')}">${esc(task || '')}</textarea>
              <div class="flex gap-2">
                <button data-hw-save data-key="${esc(subj)}" class="${aBtn('bg-emerald-600 hover:bg-emerald-500', 'Сохранить')}">Сохранить</button>
                <button data-hw-del data-key="${esc(subj)}" class="${aBtn('bg-rose-600 hover:bg-rose-500', 'Удалить')}">Удалить</button>
              </div>
            </div>`).join('') : emptyNote('Домашки нет');
        });
      }
      else if (admin.ctype === 'announcements') {
        editor.innerHTML = subNav() + announcementsEditorForm();
        $$('.ctype-btn').forEach((b) => b.addEventListener('click', () => { admin.ctype = b.dataset.ctype; loadEditor(); }));

        const btn = editor.querySelector('#ann-save');
        btn.addEventListener('click', () => {
          const text = editor.querySelector('#ann-text').value.trim();
          if (!text) { showToast('Введите текст'); return; }
          if (admin.annKey) {
            // Редактирование существующего
            node.child('announcements/' + admin.annKey).set({ text, createdAt: admin.annDate || Date.now() });
            admin.annKey = admin.annDate = null;
          } else {
            node.child('announcements').push({ text, createdAt: Date.now() });
          }
          editor.querySelector('#ann-text').value = '';
          btn.textContent = 'Опубликовать';
        });
        editor.querySelector('#ann-cancel').addEventListener('click', () => {
          admin.annKey = admin.annDate = null;
          editor.querySelector('#ann-text').value = '';
          editor.querySelector('#ann-save').textContent = 'Опубликовать';
          editor.querySelector('#ann-cancel').classList.add('hidden');
        });

        addRef(adminRefs, node.child('announcements')).on('value', (snap) => {
          const items = snapArr(snap).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          const wrap = editor.querySelector('#ann-list');
          wrap.innerHTML = items.length ? items.map((a) => `
            <div class="row rounded-xl bg-slate-900 border border-slate-800 p-3 space-y-2 fade-up">
              <p class="text-sm whitespace-pre-wrap break-words">${esc(a.text || '')}</p>
              <p class="text-[11px] text-slate-500">${fmtDate(a.createdAt)}</p>
              <div class="flex gap-2">
                <button data-ann-edit data-key="${esc(a.key)}" data-date="${a.createdAt || ''}" class="${aBtn('bg-sky-600 hover:bg-sky-500', 'Изменить')}">Изменить</button>
                <button data-ann-del data-key="${esc(a.key)}" class="${aBtn('bg-rose-600 hover:bg-rose-500', 'Удалить')}">Удалить</button>
              </div>
            </div>`).join('') : emptyNote('Объявлений нет');
        });
      }
    };

    // Города
    addRef(adminRefs, db.ref(P.cities())).on('value', (snap) => {
      const cities = snapArr(snap);
      selCity.innerHTML = '<option value="">— город —</option>' + cities.map((c) => `<option value="${esc(c.key)}">${esc(c.name || '')}</option>`).join('');
      if (admin.city && cities.some((c) => c.key === admin.city)) selCity.value = admin.city;
      // школы
      selSchool.innerHTML = '<option value="">— школа —</option>';
      selClass.innerHTML = '<option value="">— класс —</option>';
      if (admin.city) {
        db.ref(P.schools(admin.city)).once('value', (ss) => {
          const schools = snapArr(ss);
          selSchool.innerHTML = '<option value="">— школа —</option>' + schools.map((s) => `<option value="${esc(s.key)}">${esc(s.name || '')}</option>`).join('');
          if (admin.school && schools.some((s) => s.key === admin.school)) {
            selSchool.value = admin.school;
            db.ref(P.classes(admin.city, admin.school)).once('value', (cs) => {
              const classes = snapArr(cs);
              selClass.innerHTML = '<option value="">— класс —</option>' + classes.map((c) => `<option value="${esc(c.key)}">${esc(c.name || '')}</option>`).join('');
              if (admin.cls && classes.some((c) => c.key === admin.cls)) selClass.value = admin.cls;
              loadEditor();
            });
          } else {
            loadEditor();
          }
        });
      } else {
        loadEditor();
      }
    });

    selCity.addEventListener('change', () => { admin.city = selCity.value || null; admin.school = admin.cls = null; renderAdminPage('content'); });
    selSchool.addEventListener('change', () => { admin.school = selSchool.value || null; admin.cls = null; renderAdminPage('content'); });
    selClass.addEventListener('change', () => { admin.cls = selClass.value || null; renderAdminPage('content'); });
  }

  /* Формы редактора содержимого */
  function scheduleEditorForm() {
    const days = [
      ['mon', 'Понедельник'], ['tue', 'Вторник'], ['wed', 'Среда'],
      ['thu', 'Четверг'], ['fri', 'Пятница'], ['sat', 'Суббота'], ['sun', 'Воскресенье'],
    ];
    return `
      <div class="max-h-[45vh] overflow-y-auto pr-1 space-y-2">
        ${days.map(([k, name]) => `
          <div>
            <label class="text-xs text-slate-400 block mb-1">${name} <span class="text-slate-600">(урок на строке)</span></label>
            <textarea id="sch-${k}" rows="3" placeholder="Например:&#10;Математика&#10;Русский язык" class="${aInput('w-full resize-none')}"></textarea>
          </div>`).join('')}
      </div>
      <div class="flex gap-2 mt-3">
        <button id="sch-save" class="${aBtn('bg-emerald-600 hover:bg-emerald-500 flex-1 py-3 text-sm', 'Сохранить расписание')}">Сохранить расписание</button>
        <button id="sch-clear" class="${aBtn('bg-rose-600/80 hover:bg-rose-500', 'Очистить всё')}">Очистить всё</button>
      </div>`;
  }
  function homeworkEditorForm() {
    return `
      <div class="rounded-xl bg-slate-900 border border-slate-800 p-3 space-y-2 mb-3">
        <input id="hw-new-subj" placeholder="Предмет" class="${aInput('w-full font-semibold')}">
        <textarea id="hw-new-task" rows="2" placeholder="Задание" class="${aInput('w-full resize-none')}"></textarea>
        <button id="hw-add" class="${aBtn('bg-indigo-600 hover:bg-indigo-500 w-full py-2.5 text-sm', 'Добавить домашка')}">Добавить</button>
      </div>
      <div id="hw-list" class="space-y-2"></div>`;
  }
  function announcementsEditorForm() {
    return `
      <div class="rounded-xl bg-slate-900 border border-slate-800 p-3 space-y-2 mb-3">
        <p class="text-[11px] text-slate-500">Если текст содержит «Завтра контрольная» — всем придёт уведомление.</p>
        <textarea id="ann-text" rows="3" placeholder="Текст объявления" class="${aInput('w-full resize-none')}"></textarea>
        <div class="flex gap-2">
          <button id="ann-save" class="${aBtn('bg-indigo-600 hover:bg-indigo-500 flex-1 py-2.5 text-sm', 'Опубликовать')}">Опубликовать</button>
          <button id="ann-cancel" class="hidden ${aBtn('bg-slate-700 hover:bg-slate-600', 'Отмена')}">Отмена</button>
        </div>
      </div>
      <div id="ann-list" class="space-y-2"></div>`;
  }

  // Экранирование HTML в значениях из БД
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ---------- Обработчики кликов в админ-панели (делегирование) ---------- */
  function bindAdminActions() {
    $('#admin-body').addEventListener('click', (e) => {
      const t = e.target.closest('button[data-act]') ||
                e.target.closest('button[data-hw-save]') ||
                e.target.closest('button[data-hw-del]') ||
                e.target.closest('button[data-ann-edit]') ||
                e.target.closest('button[data-ann-del]');
      if (!t) return;
      const act = t.dataset.act;

      // Города
      if (act === 'citySave') {
        const key = t.dataset.key;
        const name = t.closest('.row').querySelector('[data-act="cityName"]').value.trim();
        db.ref(P.cities() + '/' + key).update({ name });
        return;
      }
      if (act === 'cityDelete') {
        askConfirm('Удалить город и все данные внутри?', () => {
          db.ref(P.cities() + '/' + t.dataset.key).remove().catch((err) => showToast('Ошибка: ' + (err.message || err)));
        });
        return;
      }
      // Школы
      if (act === 'schoolSave') {
        const cid = $('#school-city').value;
        const key = t.dataset.key;
        const name = t.closest('.row').querySelector('[data-act="schoolName"]').value.trim();
        db.ref(P.schools(cid) + '/' + key).update({ name });
        return;
      }
      if (act === 'schoolDelete') {
        askConfirm('Удалить школу и все данные внутри?', () => {
          db.ref(P.schools($('#school-city').value) + '/' + t.dataset.key).remove().catch((err) => showToast('Ошибка: ' + (err.message || err)));
        });
        return;
      }
      // Классы
      if (act === 'classSave') {
        const cid = $('#class-city').value, sid = $('#class-school').value;
        const name = t.closest('.row').querySelector('[data-act="className"]').value.trim();
        db.ref(P.classes(cid, sid) + '/' + t.dataset.key).update({ name });
        return;
      }
      if (act === 'classDelete') {
        askConfirm('Удалить класс и все данные внутри?', () => {
          db.ref(P.classes($('#class-city').value, $('#class-school').value) + '/' + t.dataset.key).remove()
            .then(() => showToast('Класс удалён'))
            .catch((err) => showToast('Ошибка: ' + (err.message || err)));
        });
        return;
      }
      // Люди и чат (вкладка people — выборка из выпадающих списков)
      const selPeo = () => {
        const cid = $('#people-city') && $('#people-city').value;
        const sid = $('#people-school') && $('#people-school').value;
        const clid = $('#people-class') && $('#people-class').value;
        return (cid && sid && clid) ? P.classNode(cid, sid, clid) : null;
      };
      // Перезапрос списка модерации после изменения статуса пользователя
      const reloadPeople = () => { if (admin.page === 'people') renderAdminPage('people'); };
      if (act === 'mute1') {
        HubModeration.muteHours(t.dataset.uid, 1).then(() => { showToast('Мут на 1 час'); reloadPeople(); })
          .catch((err) => showToast('Нет прав: ' + (err.message || err)));
        return;
      }
      if (act === 'mute24') {
        HubModeration.muteHours(t.dataset.uid, 24).then(() => { showToast('Мут на 24 часа'); reloadPeople(); })
          .catch((err) => showToast('Нет прав: ' + (err.message || err)));
        return;
      }
      if (act === 'banForever') {
        HubModeration.banForever(t.dataset.uid).then(() => { showToast('Пользователь забанен'); reloadPeople(); })
          .catch((err) => showToast('Нет прав: ' + (err.message || err)));
        return;
      }
      if (act === 'unban') {
        HubModeration.unban(t.dataset.uid).then(() => { showToast('Разблокирован'); reloadPeople(); })
          .catch((err) => showToast('Нет прав: ' + (err.message || err)));
        return;
      }
      if (act === 'purgeUser') {
        const path = selPeo();
        if (!path) { showToast('Выберите класс'); return; }
        const uidVal = t.dataset.uid;
        const nickVal = t.dataset.nick;
        askConfirm('Удалить ВСЕ сообщения пользователя «' + nickVal + '»?', () => {
          const chatRef = db.ref(path + '/chat');
          chatRef.once('value', (snap) => {
            const updates = {};
            const snapV = snap.val() || {};
            Object.keys(snapV).forEach((k) => {
              const m = snapV[k] || {};
              // по UID (новые) или по нику (старые сообщения без uid)
              if (m.uid === uidVal || (!m.uid && (m.nick || m.name) === nickVal)) updates['/chat/' + k] = null;
            });
            if (Object.keys(updates).length) {
              db.ref(path).update(updates).then(() => { showToast('Сообщения удалены'); reloadPeople(); }).catch((err) => showToast('Ошибка: ' + (err.message || err)));
            } else {
              showToast('Сообщений от этого пользователя нет');
            }
          });
        });
        return;
      }
      if (act === 'delMsg') {
        const path = selPeo();
        if (!path) { showToast('Выберите класс'); return; }
        askConfirm('Удалить это сообщение?', () => {
          db.ref(path + '/chat/' + t.dataset.key).remove()
            .then(() => forgetMsg(t.dataset.key))
            .catch((err) => showToast('Ошибка: ' + (err.message || err)));
        });
        return;
      }

      // Статистика: «Интересное»
      if (act === 'flagOpen') {
        openClassChat(t.dataset.cid, t.dataset.sid, t.dataset.clid,
          [t.dataset.cname, t.dataset.sname, t.dataset.clname].filter(Boolean).join(', '));
        return;
      }
      if (act === 'flagIgnore') {
        db.ref('/flagged_messages/' + t.dataset.cid + '/' + t.dataset.sid + '/' + t.dataset.clid + '/' + t.dataset.key)
          .remove()
          .then(() => renderAdminPage('stats'))
          .catch((err) => showToast('Ошибка: ' + (err.message || err)));
        return;
      }
      if (act === 'flagDel') {
        askConfirm('Удалить это сообщение из чата и из «Интересного»?', () => {
          const root = '/cities/' + t.dataset.cid + '/schools/' + t.dataset.sid + '/classes/' + t.dataset.clid + '/chat/' + t.dataset.key;
          Promise.all([
            db.ref(root).remove(),
            db.ref('/flagged_messages/' + t.dataset.cid + '/' + t.dataset.sid + '/' + t.dataset.clid + '/' + t.dataset.key).remove(),
          ]).then(() => renderAdminPage('stats'))
            .catch((err) => showToast('Ошибка: ' + (err.message || err)));
        });
        return;
      }

      // Домашка (кнопки без data-act)
      if ('hwSave' in t.dataset) {
        const key = t.dataset.key;
        const row = t.closest('.row');
        const subj = row.querySelector('[data-hw-key]').value.trim();
        const task = row.querySelector('[data-hw-task]').value;
        if (!subj) { showToast('Введите предмет'); return; }
        const node = db.ref(P.classNode(admin.city, admin.school, admin.cls) + '/homework');
        if (subj !== key) node.child(key).remove();
        node.child(subj).set(task);
        return;
      }
      if ('hwDel' in t.dataset) {
        db.ref(P.classNode(admin.city, admin.school, admin.cls) + '/homework/' + t.dataset.key).remove();
        return;
      }
      // Объявления
      if ('annEdit' in t.dataset) {
        const ed = $('#cont-editor');
        const textarea = ed.querySelector('#ann-text');
        admin.annKey = t.dataset.key;
        admin.annDate = t.dataset.date ? Number(t.dataset.date) : Date.now();
        textarea.value = t.closest('.row').querySelector('p').textContent.trim();
        ed.querySelector('#ann-save').textContent = 'Сохранить изменения';
        ed.querySelector('#ann-cancel').classList.remove('hidden');
        return;
      }
      if ('annDel' in t.dataset) {
        askConfirm('Удалить объявление?', () => {
          db.ref(P.classNode(admin.city, admin.school, admin.cls) + '/announcements/' + t.dataset.key).remove();
          if (admin.annKey === t.dataset.key) { admin.annKey = admin.annDate = null; }
        });
      }
    });
  }

  /* ============================================================
     ПОДКЛЮЧЕНИЕ СОБЫТИЙ И ЗАПУСК
     ============================================================ */
  // Кнопка закрытия toast
  $('#toast-close').addEventListener('click', hideToast);

  // Экран входа
  $('#back-btn').addEventListener('click', onBack);
  $('#change-btn').addEventListener('click', resetSelection);

  // Вкладки
  $$('.tab-btn').forEach((b) => b.addEventListener('click', () => switchTab(b.dataset.tab)));

  // Чат
  $('#chat-form').addEventListener('submit', sendMessage);
  $('#chat-nick').addEventListener('click', changeNick);
  // Удаление сообщения администратором (альт-менедж)
  $('#chat-messages').addEventListener('click', (e) => {
    const btn = e.target.closest('.msg-del');
    if (!btn) return;
    if (!(admin.authorized && altMode())) return;
    const wrap = btn.closest('[data-msg]');
    if (!wrap) return;
    askConfirm('Удалить это сообщение?', () => {
      db.ref(curClassPath() + '/chat/' + wrap.dataset.msg).remove()
        .then(() => forgetMsg(wrap.dataset.msg))
        .catch((err) => showToast('Ошибка: ' + (err.message || err)));
    });
  });

  // Ник
  $('#nick-save').addEventListener('click', saveNick);
  $('#nick-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveNick(); });

  // Секретный вход
  bindLongPress($('#header-title'), openAdmin);
  bindNTaps($('#logo'), 5, openAdmin);
  // С главного заголовка экрана входа админка тоже доступна (для первичного заполнения данных)
  bindLongPress($('#auth-title'), openAdmin);
  bindNTaps($('#auth-logo'), 5, openAdmin);

  // Модалка пароля администратора
  $('#pass-btn').addEventListener('click', tryLogin);
  $('#pass-cancel').addEventListener('click', closePassModal);
  $('#pass-overlay').addEventListener('click', closePassModal);
  $('#pass-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); });

  // Просмотр чата
  $('#view-close').addEventListener('click', () => $('#view-modal').classList.add('hidden'));
  $('#view-overlay').addEventListener('click', () => $('#view-modal').classList.add('hidden'));

  // Админ-панель
  $('#admin-close').addEventListener('click', closeAdmin);
  $('#admin-overlay').addEventListener('click', closeAdmin);
  $$('#admin-nav button').forEach((b) => b.addEventListener('click', () => renderAdminPage(b.dataset.apage)));
  bindAdminActions();

  // Старт приложения
  function start() {
    initSeen();
    initFirebase();
    if (!isConfigured()) {
      // Показываем экран входа с подсказкой про конфиг
      showAuth();
      return;
    }
    loadSelection();
    const s = state.sel;
    if (s && s.cid && s.sid && s.clid) {
      showMainScreen();
    } else {
      showAuth();
    }
    // Анонимная авторизация Firebase: если пользователь уже входил,
    // Firebase восстановит сессию автоматически. Присутствие и профиль
    // users/{uid} запускаем только после готовности входа (правила требуют auth).
    HubAuth.start(() => {
      startPresence(); // онлайн-присутствие и уникальные пользователи
      ensureProfile(); // создаём/обновляем профиль (nick, class, createdAt)
      document.dispatchEvent(new CustomEvent('hub-auth-done'));
    });
  }

  document.addEventListener('DOMContentLoaded', start);

  // Регистрация Service Worker (PWA)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then((reg) => {
          // Принудительно проверяем наличие обновлённого sw.js при каждом заходе
          if (reg.update) reg.update();
        })
        .catch(() => { /* работаем и без SW */ });
    });
  }
  </script>

  <script>
    // Аварийная диагностика ДО и ПОСЛЕ основного скрипта: если что-то упало
    // (в том числе ошибка парсинга основного скрипта), показываем сообщение
    // вместо пустого экрана с одним логотипом.
    window.addEventListener('error', function (ev) {
      var msg = (ev && ev.message) || 'Неизвестная ошибка';
      if (/script\.error\./i.test(msg)) msg = 'Ошибка стороннего скрипта (возможно, нет интернета для CDN)';
      var auth = document.getElementById('auth-screen');
      if (!auth || auth.classList.contains('hidden')) return;
      var d = document.getElementById('select-list');
      var s = document.getElementById('select-status');
      if (s) s.textContent = 'Что-то пошло не так.';
      if (d) {
        d.innerHTML = '<div class="text-center py-10 text-amber-400 text-sm fade-up">Ошибка: ' + msg +
          '<br><span style="font-size:11px;opacity:.7">Обновите страницу (Ctrl+F5). Если повторяется — пришлите этот текст.</span></div>';
      }
    });
  </script>
</body>
