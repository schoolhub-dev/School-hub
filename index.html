<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Школьный Хаб</title>
  <meta name="description" content="Расписание, домашние задания, объявления и чат класса.">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
    (function () {
      var saved = localStorage.getItem('sh_theme') || 'dark';
      document.documentElement.classList.toggle('dark', saved === 'dark');
      var accent = localStorage.getItem('sh_accent') || 'indigo';
      document.documentElement.setAttribute('data-accent', accent);
    })();
  </script>

  <style>
    @keyframes toast-in { from { transform: translateY(-16px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes fade-up  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .toast-in { animation: toast-in .25s ease-out; }
    .fade-up  { animation: fade-up .25s ease-out; }

    .no-select { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .hold { opacity: .6; transform: scale(.98); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }

    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .pt-safe { padding-top: env(safe-area-inset-top); }

    .chat-scroll { height: calc(100vh - 340px); height: calc(100dvh - 330px); }

    .avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 9999px; font-weight: 700; flex-shrink: 0; }
    .avatar-sm { width: 28px; height: 28px; font-size: 12px; }
    .avatar-md { width: 40px; height: 40px; font-size: 16px; }
    .avatar-lg { width: 64px; height: 64px; font-size: 24px; }

    .accent-dot { width: 36px; height: 36px; border-radius: 9999px; border: 3px solid transparent; cursor: pointer; transition: transform .15s; }
    .accent-dot:hover { transform: scale(1.1); }
    .accent-dot.active { border-color: #fff; box-shadow: 0 0 0 2px #6366f1; }
    html:not(.dark) .accent-dot.active { border-color: #0f172a; }

    html[data-accent="indigo"] .accent-bg { background-color: #6366f1 !important; }
    html[data-accent="blue"]   .accent-bg { background-color: #3b82f6 !important; }
    html[data-accent="emerald"] .accent-bg { background-color: #10b981 !important; }
    html[data-accent="rose"]   .accent-bg { background-color: #f43f5e !important; }
    html[data-accent="amber"]  .accent-bg { background-color: #f59e0b !important; }
    html[data-accent="violet"] .accent-bg { background-color: #8b5cf6 !important; }

    html[data-accent="indigo"] .accent-text { color: #818cf8 !important; }
    html[data-accent="blue"]   .accent-text { color: #60a5fa !important; }
    html[data-accent="emerald"] .accent-text { color: #34d399 !important; }
    html[data-accent="rose"]   .accent-text { color: #fb7185 !important; }
    html[data-accent="amber"]  .accent-text { color: #fbbf24 !important; }
    html[data-accent="violet"] .accent-text { color: #a78bfa !important; }

    html[data-accent="indigo"] .accent-border { border-color: #6366f1 !important; }
    html[data-accent="blue"]   .accent-border { border-color: #3b82f6 !important; }
    html[data-accent="emerald"] .accent-border { border-color: #10b981 !important; }
    html[data-accent="rose"]   .accent-border { border-color: #f43f5e !important; }
    html[data-accent="amber"]  .accent-border { border-color: #f59e0b !important; }
    html[data-accent="violet"] .accent-border { border-color: #8b5cf6 !important; }

    .hw-check { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #475569; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s; }
    .hw-check.done { background: #10b981; border-color: #10b981; }
    .hw-check.done svg { display: block; }
    .hw-check svg { display: none; width: 14px; height: 14px; color: #fff; }

    .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: default; }
    .cal-day.today { background: #6366f1; color: #fff; }
    .cal-day.has-ann { background: rgba(99,102,241,.15); color: #818cf8; }
    .cal-day.empty { opacity: .25; }

    .chat-search { position: sticky; top: 0; z-index: 5; background: rgba(15,23,42,.95); backdrop-filter: blur(6px); padding: 8px 0; }
    html:not(.dark) .chat-search { background: rgba(248,250,252,.95); }

    /* Реакции */
    .reaction-pill {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 7px; border-radius: 9999px;
      font-size: 11px; cursor: pointer; user-select: none;
      background: rgba(99,102,241,.15); border: 1px solid rgba(99,102,241,.3);
      transition: transform .1s;
    }
    .reaction-pill:active { transform: scale(.95); }
    .reaction-pill.mine { background: rgba(99,102,241,.35); border-color: rgba(99,102,241,.6); }

    /* Панель реакций */
    .reactions-bar {
      position: absolute; z-index: 30;
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 6px; display: flex; gap: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
    }
    html:not(.dark) .reactions-bar { background: #fff; border-color: #e2e8f0; box-shadow: 0 10px 30px rgba(0,0,0,.1); }
    .reactions-bar button {
      width: 32px; height: 32px; border-radius: 8px; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; background: transparent; transition: background .1s;
    }
    .reactions-bar button:hover { background: rgba(99,102,241,.2); }

    /* Reply-превью в сообщении */
    .reply-preview {
      border-left: 3px solid #6366f1; padding: 3px 8px;
      background: rgba(0,0,0,.15); border-radius: 6px; margin-bottom: 4px;
      font-size: 11px; opacity: .85;
    }
    html:not(.dark) .reply-preview { background: rgba(0,0,0,.05); }

    /* Reply-плашка над полем ввода */
    #chat-reply-box {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; background: rgba(99,102,241,.15);
      border-radius: 10px; margin-bottom: 8px;
      border-left: 3px solid #6366f1;
    }
    /* Tailwind .hidden не перебивает display:flex у ID-селектора выше */
    #chat-reply-box.hidden { display: none; }
    #chat-edit-box.hidden { display: none; }

    /* @mention в тексте */
    .mention { color: #818cf8; font-weight: 600; }

    /* Редактирование сообщения */
    .msg-edited { font-size: 9px; opacity: .6; font-style: italic; }

    /* Статус "печатает..." */
    #typing-indicator {
      font-size: 11px; color: #94a3b8; font-style: italic;
      padding: 4px 4px 0; min-height: 16px;
    }

    /* Счётчик непрочитанных на вкладке */
    .unread-badge {
      position: absolute; top: 2px; right: 2px;
      min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 9999px; background: #ef4444; color: #fff;
      font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }

    .msg-hidden { display: none !important; }
    .msg-highlight { background: rgba(251,191,36,.25) !important; }
    .msg-flagmark { font-size: 10px; opacity: .8; }

    /* ==== Светлая тема ==== */
    html:not(.dark) body { background: #f8fafc; color: #0f172a; }
    html:not(.dark) .bg-slate-950 { background-color: #f8fafc !important; }
    html:not(.dark) .bg-slate-950\/90 { background-color: rgba(248,250,252,.92) !important; }
    html:not(.dark) .bg-slate-950\/10 { background-color: rgba(0,0,0,.06) !important; }
    html:not(.dark) .bg-slate-900 { background-color: #ffffff !important; }
    html:not(.dark) .bg-slate-800 { background-color: #f1f5f9 !important; }
    html:not(.dark) .bg-slate-800\/50 { background-color: rgba(241,245,249,.7) !important; }
    html:not(.dark) .bg-slate-700 { background-color: #e2e8f0 !important; }
    html:not(.dark) .border-slate-800 { border-color: #e2e8f0 !important; }
    html:not(.dark) .border-slate-700 { border-color: #cbd5e1 !important; }
    html:not(.dark) .text-slate-100 { color: #0f172a !important; }
    html:not(.dark) .text-slate-200 { color: #1e293b !important; }
    html:not(.dark) .text-slate-300 { color: #334155 !important; }
    html:not(.dark) .text-slate-400 { color: #64748b !important; }
    html:not(.dark) .text-slate-500 { color: #94a3b8 !important; }
    html:not(.dark) .text-slate-600 { color: #94a3b8 !important; }
    html:not(.dark) .placeholder-slate-500::placeholder { color: #94a3b8 !important; }
    html:not(.dark) .bg-black\/60 { background-color: rgba(0,0,0,.4) !important; }
    html:not(.dark) .bg-black\/70 { background-color: rgba(0,0,0,.5) !important; }
    html:not(.dark) input, html:not(.dark) textarea, html:not(.dark) select { color: #0f172a; }
    html:not(.dark) input::placeholder, html:not(.dark) textarea::placeholder { color: #94a3b8; }
    html:not(.dark) ::-webkit-scrollbar-thumb { background: #cbd5e1; }
  </style>
</head>

<body class="bg-white text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased min-h-screen transition-colors">

  <!-- ======================= TOAST ======================= -->
  <div id="toast" class="hidden fixed top-3 left-3 right-3 z-[70] rounded-xl bg-amber-400 text-slate-950 shadow-2xl px-4 py-3 flex items-center gap-3 text-sm toast-in max-w-md mx-auto">
    <svg class="shrink-0 w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.9 5h13.8a2 2 0 001.78-3L13.78 4.9a2 2 0 00-3.56 0L4.12 18a2 2 0 001.78 3z"/>
    </svg>
    <div class="flex-1 min-w-0">
      <div class="font-extrabold">Уведомление</div>
      <div id="toast-text" class="truncate opacity-80 font-medium"></div>
    </div>
    <button id="toast-close" class="shrink-0 w-7 h-7 rounded-full bg-slate-950/10 flex items-center justify-center font-bold" aria-label="Закрыть">✕</button>
  </div>

  <!-- ======================= ЭКРАН ВХОДА ======================= -->
  <div id="auth-screen" class="min-h-screen flex flex-col">
    <header class="px-5 pt-safe pt-14 pb-6 text-center">
      <div id="auth-logo" class="no-select mx-auto w-14 h-14 rounded-2xl accent-bg flex items-center justify-center shadow-lg shadow-indigo-900/40">
        <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.25c-1.8-1.3-4.6-1.75-7.75-1.25v12.5c3.15-.5 5.95-.05 7.75 1.25 1.8-1.3 4.6-1.75 7.75-1.25V5c-3.15-.5-5.95-.05-7.75 1.25z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.25v12.5"/>
        </svg>
      </div>
      <h1 id="auth-title" class="no-select text-2xl font-extrabold mt-3">Школьный Хаб</h1>
      <p class="text-slate-400 text-sm mt-1">Расписание, домашка, объявления и чат класса</p>
    </header>

    <div class="flex-1 px-4 pb-6 w-full max-w-md mx-auto">
      <div class="flex items-center gap-3 mb-4">
        <button id="back-btn" class="hidden h-10 w-10 shrink-0 rounded-full bg-slate-800 flex items-center justify-center hover:bg-slate-700" aria-label="Назад">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <h2 id="select-title" class="text-lg font-bold"></h2>
      </div>
      <div id="select-status" class="text-xs text-slate-500 mb-3"></div>
      <div id="select-list" class="grid gap-2"></div>
    </div>
  </div>

  <!-- ======================= ГЛАВНЫЙ ЭКРАН ======================= -->
  <div id="main-screen" class="hidden min-h-screen flex flex-col">
    <div class="sticky top-0 z-30 bg-slate-950/90 backdrop-blur border-b border-slate-800 pt-safe">
      <div class="w-full max-w-md mx-auto">
        <div class="flex items-center gap-3 px-4 pt-2 pb-2">
          <div id="logo" class="no-select shrink-0 h-10 w-10 rounded-xl accent-bg flex items-center justify-center cursor-pointer">
            <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.25c-1.8-1.3-4.6-1.75-7.75-1.25v12.5c3.15-.5 5.95-.05 7.75 1.25 1.8-1.3 4.6-1.75 7.75-1.25V5c-3.15-.5-5.95-.05-7.75 1.25z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.25v12.5"/>
            </svg>
          </div>
          <button id="header-title" class="no-select flex-1 text-left leading-tight cursor-pointer transition-transform duration-200">
            <span id="header-text" class="block font-bold text-sm truncate">Находка, Школа №4, 7А</span>
            <span class="block text-[11px] text-slate-400">
              <span id="header-clock">—</span> · Твой класс
            </span>
          </button>
          <button id="change-btn" class="shrink-0 px-3 py-2 rounded-lg bg-slate-800 text-xs font-semibold hover:bg-slate-700 active:scale-95 transition">
            Сменить
          </button>
        </div>

        <nav class="flex gap-1 px-3 pb-2">
          <button data-tab="schedule" class="tab-btn relative flex-1 flex flex-col items-center gap-0.5 py-2 rounded-lg text-[11px] font-semibold text-slate-400">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3M4 8h16M5 5h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1z"/>
            </svg>
            <span>Расписание</span>
          </button>
          <button data-tab="homework" class="tab-btn relative flex-1 flex flex-col items-center gap-0.5 py-2 rounded-lg text-[11px] font-semibold text-slate-400">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6M7 4h10a2 2 0 012 2v14l-3-2-3 2-3-2-3 2V6a2 2 0 012-2z"/>
            </svg>
            <span>Домашка</span>
          </button>
          <button data-tab="announcements" class="tab-btn relative flex-1 flex flex-col items-center gap-0.5 py-2 rounded-lg text-[11px] font-semibold text-slate-400">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 9a5 5 0 010 6M19.5 6a9 9 0 010 12M8 11h.01M8 15h-1a3 3 0 01-3-3v0a3 3 0 013-3h1v6zm10.5-6a9 9 0 010 12"/>
            </svg>
            <span>Объявл.</span>
          </button>
          <button data-tab="chat" class="tab-btn relative flex-1 flex flex-col items-center gap-0.5 py-2 rounded-lg text-[11px] font-semibold text-slate-400">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.4-4 8-9 8-1 0-2-.15-2.9-.4L4 21l1.5-3.9A7.8 7.8 0 013 12c0-4.4 4-8 9-8s9 3.6 9 8z"/>
            </svg>
            <span>Чат</span>
            <span id="chat-unread" class="unread-badge hidden"></span>
          </button>
          <button id="tab-settings-btn" data-tab="settings"
                  class="tab-btn relative flex-1 flex-col items-center gap-0.5 py-2 rounded-lg text-[11px] font-semibold text-slate-400">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.3 4.3 11 3a1 1 0 0 1 2 0l.7 1.3a1 1 0 0 0 .9.5l1.5-.1a1 1 0 0 1 1 1l.1 1.5c0 .4.2.7.5.9l1.3.7a1 1 0 0 1 0 2l-1.3.7a1 1 0 0 0-.5.9l.1 1.5a1 1 0 0 1-1 1l-1.5-.1a1 1 0 0 0-.9.5L13 21a1 1 0 0 1-2 0l-.7-1.3a1 1 0 0 0-.9-.5l-1.5.1a1 1 0 0 1-1-1l-.1-1.5a1 1 0 0 0-.5-.9l-1.3-.7a1 1 0 0 1 0-2l1.3-.7a1 1 0 0 0 .5-.9L6.5 9a1 1 0 0 1 1-1L9 8.1c.4 0 .7-.2.9-.5l.7-1.3z"/>
              <circle cx="12" cy="12" r="2.6"/>
            </svg>
            <span>Настройки</span>
          </button>
        </nav>
      </div>
    </div>

    <main class="flex-1 w-full max-w-md mx-auto px-4 py-4 pb-safe">
      <section id="tab-schedule" class="tab space-y-4"></section>
      <section id="tab-homework" class="tab hidden space-y-3"></section>
      <section id="tab-announcements" class="tab hidden space-y-3"></section>
      <section id="tab-chat" class="tab hidden flex flex-col">
        <div class="flex items-center justify-between mb-2">
          <p class="text-xs text-slate-400">Ты в чате как <button id="chat-nick" class="font-bold accent-text underline decoration-dotted">—</button></p>
          <button id="chat-search-btn" class="text-xs text-slate-400 hover:text-slate-200 px-2 py-1 rounded">🔍 Поиск</button>
        </div>
        <div id="chat-search-box" class="chat-search hidden">
          <input id="chat-search-input" type="text" placeholder="Поиск по сообщениям…"
                 class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 text-sm placeholder-slate-500 outline-none focus:border-indigo-500">
        </div>
        <div id="chat-messages" class="chat-scroll space-y-3 overflow-y-auto pr-1"></div>
        <div id="typing-indicator"></div>

        <!-- Reply-превью -->
        <div id="chat-reply-box" class="hidden">
          <div class="flex-1 min-w-0">
            <div class="text-[10px] font-bold accent-text" id="chat-reply-nick"></div>
            <div class="text-[11px] text-slate-500 truncate" id="chat-reply-text"></div>
          </div>
          <button id="chat-reply-close" class="text-slate-400 hover:text-rose-400 font-bold px-2">✕</button>
        </div>

        <!-- Edit-превью -->
        <div id="chat-edit-box" class="hidden flex items-center gap-2 px-3 py-2 mb-2 rounded-lg bg-amber-500/15 border-l-4 border-amber-500">
          <div class="flex-1 min-w-0">
            <div class="text-[10px] font-bold text-amber-400">РЕДАКТИРОВАНИЕ</div>
            <div class="text-[11px] text-slate-500 truncate" id="chat-edit-text"></div>
          </div>
          <button id="chat-edit-close" class="text-slate-400 hover:text-rose-400 font-bold px-2">✕</button>
        </div>

        <form id="chat-form" class="flex gap-2 mt-3 pt-3 bg-slate-950/90 backdrop-blur">
          <input id="chat-input" type="text" maxlength="500" autocomplete="off"
                 placeholder="Сообщение… (@ник — упомянуть)"
                 class="flex-1 min-w-0 rounded-xl bg-slate-800 border border-transparent px-4 py-2.5 text-sm placeholder-slate-500 outline-none focus:border-indigo-500 transition">
          <button type="submit" class="shrink-0 h-11 w-11 rounded-xl accent-bg flex items-center justify-center hover:opacity-90 active:scale-95 transition" aria-label="Отправить">
            <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9-7-9-7v14zm0 0V5"/>
            </svg>
          </button>
        </form>
      </section>
      <section id="tab-settings" class="tab hidden space-y-4"></section>
    </main>
  </div>

  <!-- ======================= МОДАЛКА НИКА ======================= -->
  <div id="nick-modal" class="hidden fixed inset-0 z-[60] items-center justify-center bg-black/70 backdrop-blur-sm p-4">
    <div class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-800 p-5 shadow-2xl">
      <h3 class="text-lg font-bold">Как тебя зовут?</h3>
      <p class="text-sm text-slate-400 mt-1">Ник будет виден одноклассникам в чате.</p>
      <input id="nick-input" type="text" maxlength="30" autocomplete="nickname"
             placeholder="Введите ник"
             class="mt-4 w-full rounded-xl bg-slate-800 border border-slate-700 px-4 py-2.5 text-sm placeholder-slate-500 outline-none focus:border-indigo-500 transition">
      <p id="nick-error" class="hidden text-xs text-rose-400 mt-2"></p>
      <button id="nick-save" class="mt-4 w-full rounded-xl accent-bg py-3 text-sm font-bold text-white hover:opacity-90 active:scale-[.98] transition">
        Сохранить
      </button>
    </div>
  </div>

  function sHashFb(str) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return ((h2 >>> 0).toString(16).padStart(8, '0')) + ((h1 >>> 0).toString(16).padStart(8, '0'));
  }
  function sha256(str) {
    const enc = new TextEncoder().encode(str);
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      return crypto.subtle.digest('SHA-256', enc)
        .then((buf) => Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join(''));
    }
    return Promise.resolve(sHashFb(str));
  }

    return String(s).toLowerCase()
      .replace(/ё/g, 'е')
      .replace(/[a-z]/g, (ch) => (tr[ch] || ''))
      .replace(/[^а-я ]/g, ' ');
  }
  // Возвращает массив найденных основ/слов (может быть пустым)
  function findBadWords(text) {
    const words = filterNorm(text).split(/ +/).filter(Boolean);
    const hits = [];
    words.forEach((w) => {
      if (w.length < 3) return;
      if (FILTER_EXACT.has(w)) { if (hits.indexOf(w) === -1) hits.push(w); return; }
      for (let i = 0; i < FILTER_STEMS.length; i++) {
        if (w.startsWith(FILTER_STEMS[i])) {
          if (hits.indexOf(FILTER_STEMS[i]) === -1) hits.push(FILTER_STEMS[i]);
          break;
        }
      }
    });
    return hits;
  }

  function seedSchool25() {
    db.ref('/cities').once('value', (snap) => {
      const cities = snap.val() || {};
      let cid = null;
      Object.keys(cities).forEach((k) => {
        if ((cities[k].name || '').toLowerCase().includes('находка')) cid = k;
      });
      const ensureClasses = (cityId, schoolId) => {
        const wanted = ['6А', '6Б', '6В', '6Г', '6Д'];
        db.ref(`/cities/${cityId}/schools/${schoolId}/classes`).once('value', (c2) => {
          const classes = c2.val() || {};
          const existing = Object.keys(classes).map((k) => (classes[k].name || '').trim());
          const toAdd = wanted.filter((n) => !existing.includes(n));
          if (!toAdd.length) return;
          const updates = {};
          toAdd.forEach((name) => {
            const key = db.ref(`/cities/${cityId}/schools/${schoolId}/classes`).push().key;
            updates[`${key}/name`] = name;
          });
          db.ref(`/cities/${cityId}/schools/${schoolId}/classes`).update(updates).catch(() => {});
        });
      };
      const ensureSchool = (cityId) => {
        db.ref(`/cities/${cityId}/schools`).once('value', (s2) => {
          const schools = s2.val() || {};
          let sid = null;
          Object.keys(schools).forEach((k) => {
            const n = (schools[k].name || '').toLowerCase();
            if (n.includes('25') || n.includes('№25')) sid = k;
          });
          if (!sid) {
            db.ref(`/cities/${cityId}/schools`).push({ name: 'Школа №25' })
              .then((ref) => ensureClasses(cityId, ref.key));
          } else ensureClasses(cityId, sid);
        });
      };
      if (!cid) db.ref('/cities').push({ name: 'Находка' }).then((ref) => ensureSchool(ref.key));
      else ensureSchool(cid);
    });
  }

    const DAY_MAP = [
      [/понед/i, 'mon'], [/вторн/i, 'tue'], [/сред/i, 'wed'],
      [/четверг/i, 'thu'], [/пятниц/i, 'fri'], [/суббот/i, 'sat'], [/воскрес/i, 'sun'],
    ];
    const detectClass = (table) => {
      let cn = '';
      const cap = table.querySelector('caption');
      if (cap) cn = cap.textContent.trim();
      if (!cn) {
        let prev = table.previousElementSibling;
        while (prev && !cn) {
          const m = (prev.textContent || '').match(/\b(\d{1,2})\s*[-\s]?\s*([А-ЯA-Z])\b/i);
          if (m) cn = (m[1] + m[2]).toUpperCase();
          prev = prev.previousElementSibling;
        }
      }
      if (!cn) {
        const fr = table.querySelector('tr');
        if (fr) {
          const m = fr.textContent.match(/\b(\d{1,2})\s*[-\s]?\s*([А-ЯA-Z])\b/i);
          if (m) cn = (m[1] + m[2]).toUpperCase();
        }
      }
      return cn;
    };
    doc.querySelectorAll('table').forEach((table) => {
      const className = detectClass(table);
      if (!className) return;
      const schedule = { mon: [], tue: [], wed: [], thu: [], fri: [], sat: [], sun: [] };
      const rows = Array.from(table.querySelectorAll('tr'));
      if (!rows.length) return;
      const headerCells = Array.from(rows[0].querySelectorAll('th,td')).map((c) => c.textContent.trim());
      const colDayIdx = {};
      headerCells.forEach((txt, idx) => DAY_MAP.forEach(([re, key]) => { if (re.test(txt)) colDayIdx[key] = idx; }));
      if (Object.keys(colDayIdx).length >= 2) {
        for (let r = 1; r < rows.length; r++) {
          const cells = Array.from(rows[r].querySelectorAll('th,td'));
          Object.keys(colDayIdx).forEach((dayKey) => {
            const cell = cells[colDayIdx[dayKey]];
            if (!cell) return;
            const txt = cell.textContent.replace(/\s+/g, ' ').trim();
            if (txt && txt !== '-' && txt !== '—') schedule[dayKey].push(txt);
          });
        }
      } else {
        rows.forEach((row) => {
          const cells = Array.from(row.querySelectorAll('th,td'));
          if (!cells.length) return;
          const firstTxt = cells[0].textContent.trim();
          let dayKey = null;
          DAY_MAP.forEach(([re, key]) => { if (re.test(firstTxt)) dayKey = key; });
          if (!dayKey) return;
          for (let c = 1; c < cells.length; c++) {
            const txt = cells[c].textContent.replace(/\s+/g, ' ').trim();
            if (txt && txt !== '-' && txt !== '—') schedule[dayKey].push(txt);
          }
        });
      }
      const total = Object.values(schedule).reduce((a, b) => a + b.length, 0);
      if (total > 0) result[className] = schedule;
    });
    return result;
  }
  function syncFromNika(cid, sid, clid) {
    showToast('Загрузка расписания с Ника-Софт…');
    fetchViaProxy(NIKA_URL)
      .then((html) => {
        const parsed = parseNikaHtml(html);
        const names = Object.keys(parsed);
        if (!names.length) { showToast('Не удалось распознать расписание'); return; }
        db.ref(P.classNode(cid, sid, clid) + '/name').once('value', (s) => {
          const our = (s.val() || '').trim().toUpperCase();
          let matched = parsed[our];
          if (!matched) {
            const k = names.find((n) => n.replace(/\s/g, '') === our.replace(/\s/g, ''));
            if (k) matched = parsed[k];
          }
          if (!matched) { showToast('Нет класса «' + our + '». Найдены: ' + names.join(', ')); return; }
          db.ref(P.classNode(cid, sid, clid) + '/schedule').set(matched)
            .then(() => showToast('Расписание обновлено'))
            .catch((err) => showToast('Ошибка: ' + (err.message || err)));
        });
      })
      .catch((err) => showToast('Ошибка загрузки: ' + (err.message || err)));
  }

  function askConfirm(text, onYes) {

    let el = document.getElementById('confirm-box');
    if (!el) {
      el = document.createElement('div');

      el.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(2,6,23,.78);display:flex;align-items:center;justify-content:center;padding:16px;';

            <button data-ac="yes" class="flex-1 rounded-xl bg-rose-600 hover:bg-rose-500 px-4 py-2.5 text-sm font-semibold text-white">Удалить</button>
          </div>

    el.querySelector('p').textContent = text;
    el.__cb = onYes;
  }

  /* ---- Часы ---- */
  let clockTimer = null;
  function startClock() {
    if (clockTimer) return;
    const upd = () => {
      const el = $('#header-clock');
      if (!el) return;
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      el.textContent = `${p(d.getHours())}:${p(d.getMinutes())} · ${DAY_NAMES[d.getDay()]}`;
    };
    upd();

  /* ---- Объявления ---- */
  let seenSet = new Set();
  function initSeen() {
    try { seenSet = new Set(JSON.parse(localStorage.getItem(LS.seen) || '[]')); } catch (e) { seenSet = new Set(); }
  }
  function persistSeen() {
    try { localStorage.setItem(LS.seen, JSON.stringify(Array.from(seenSet))); } catch (e) {}
  }
  const CTRL_RE = /завтра\s+контрольн/iu;

  function onNewAnnouncement(snap) {
    const a = snap.val();
    if (!a || !a.text) return;
    const already = seenSet.has(snap.key);
    seenSet.add(snap.key);
    persistSeen();
    if (!already && CTRL_RE.test(a.text)) showToast(a.text);

  /* ---- Вкладки ---- */

    $$('.tab-btn').forEach((b) => {

  /* ---- Расписание ---- */
  let scheduleCache = {};
  let scheduleView = 'today';
  function renderSchedule(snap) {
    scheduleCache = snap.val() || {};
    paintSchedule();
  }
  function paintSchedule() {
    const data = scheduleCache;
    const todayIdx = new Date().getDay();
    const tomorrowIdx = (todayIdx + 1) % 7;
    const el = $('#tab-schedule');
    const head = `
      <div class="flex gap-1 bg-slate-900 border border-slate-800 rounded-xl p-1">
        <button data-sview="today" class="sview flex-1 py-2 rounded-lg text-xs font-bold ${scheduleView === 'today' ? 'accent-bg text-white' : 'text-slate-400'}">Сегодня</button>
        <button data-sview="tomorrow" class="sview flex-1 py-2 rounded-lg text-xs font-bold ${scheduleView === 'tomorrow' ? 'accent-bg text-white' : 'text-slate-400'}">Завтра</button>
        <button data-sview="week" class="sview flex-1 py-2 rounded-lg text-xs font-bold ${scheduleView === 'week' ? 'accent-bg text-white' : 'text-slate-400'}">Неделя</button>
      </div>`;
    const dayBlock = (key, title, dayName) => {
      const lessons = Array.isArray(data[key]) ? data[key] : [];
      const inner = lessons.length
        ? lessons.map((l, i) => `
            <li class="flex items-center gap-3 px-1">
              <span class="shrink-0 w-7 h-7 rounded-full accent-bg text-white text-xs font-bold flex items-center justify-center">${i + 1}</span>
              <span class="flex-1 text-sm">${esc(l)}</span>
            </li>`).join('')
        : '<li class="text-sm text-slate-500 px-1">Уроков нет 😌</li>';
      return `
        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 fade-up">
          <h3 class="font-bold text-sm mb-3">${title} · ${dayName}</h3>
          <ul class="space-y-2.5">${inner}</ul>
        </div>`;
    };
    let body = '';
    if (scheduleView === 'today') body = dayBlock(DAY_KEYS[todayIdx], 'Сегодня', DAY_NAMES[todayIdx]);
    else if (scheduleView === 'tomorrow') body = dayBlock(DAY_KEYS[tomorrowIdx], 'Завтра', DAY_NAMES[tomorrowIdx]);
    else {
      const order = ['mon','tue','wed','thu','fri','sat','sun'];
      body = order.map((k) => dayBlock(k, DAY_NAMES[DAY_KEYS.indexOf(k)], '')).join('');
    }
    const copyBtn = `<button id="sch-copy" class="w-full rounded-xl bg-slate-800 hover:bg-slate-700 py-2.5 text-xs font-bold">📋 Скопировать расписание</button>`;
    el.innerHTML = head + body + copyBtn;
    $$('.sview').forEach((b) => b.addEventListener('click', () => { scheduleView = b.dataset.sview; paintSchedule(); }));
    $('#sch-copy').addEventListener('click', copySchedule);
  }
  function copySchedule() {
    const data = scheduleCache;
    const lines = [];
    const order = ['mon','tue','wed','thu','fri','sat','sun'];
    order.forEach((k) => {
      const idx = DAY_KEYS.indexOf(k);
      const lessons = Array.isArray(data[k]) ? data[k] : [];
      if (!lessons.length) return;
      lines.push(DAY_NAMES[idx] + ':');
      lessons.forEach((l, i) => lines.push(`  ${i + 1}. ${l}`));
      lines.push('');
    });
    const txt = lines.join('\n') || 'Расписание пусто';
    navigator.clipboard.writeText(txt).then(() => showToast('Расписание скопировано'))
      .catch(() => showToast('Не удалось скопировать'));
  }

  /* ---- Домашка ---- */
  let hwCache = {};
  function renderHomework(snap) { hwCache = snap.val() || {}; paintHomework(); }
  function hwDoneKey(subj) { return curClassKey() + '|' + subj; }
  function isHwDone(subj) {
    try { return JSON.parse(localStorage.getItem(LS.hwDone) || '[]').includes(hwDoneKey(subj)); }
    catch (e) { return false; }
  }
  function setHwDone(subj, done) {
    let arr = [];
    try { arr = JSON.parse(localStorage.getItem(LS.hwDone) || '[]'); } catch (e) {}
    const key = hwDoneKey(subj);
    if (done && !arr.includes(key)) arr.push(key);
    if (!done) arr = arr.filter((x) => x !== key);
    localStorage.setItem(LS.hwDone, JSON.stringify(arr));
  }
  function paintHomework() {
    const entries = Object.entries(hwCache).sort((a, b) => a[0].localeCompare(b[0], 'ru'));
    const el = $('#tab-homework');
    if (!entries.length) { el.innerHTML = emptyNote('Домашки нет 🎉'); return; }

    el.innerHTML = `
      <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 fade-up">

        </div>
        <div class="h-2 rounded-full bg-slate-800 overflow-hidden">
          <div class="h-full accent-bg transition-all" style="width:${pct}%"></div>

        return `
          <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 fade-up">
            <div class="flex items-start gap-3">
              <button class="hw-check ${d ? 'done' : ''}" data-hw-subj="${esc(subj)}" aria-label="Сделано">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>

              </button>
              <div class="flex-1 min-w-0">
                <h4 class="font-bold text-sm ${d ? 'line-through opacity-60' : ''}">${esc(subj)}</h4>
                <p class="text-sm text-slate-300 whitespace-pre-wrap break-words mt-1 ${d ? 'line-through opacity-60' : ''}">${esc(task || '—')}</p>
              </div>
            </div>

      }).join('')}`;
    $$('.hw-check').forEach((b) => b.addEventListener('click', () => {

  /* ---- Объявления ---- */
  let annCache = [];
  function renderAnnouncements(snap) {
    annCache = snapArr(snap).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    paintAnnouncements();
  }
  function paintAnnouncements() {
    const el = $('#tab-announcements');
    if (!annCache.length) { el.innerHTML = emptyNote('Объявлений пока нет'); return; }
    const [first, ...rest] = annCache;
    const isCtrl = (txt) => CTRL_RE.test(txt || '');
    const pinned = `
      <div class="rounded-2xl p-4 border-2 accent-border bg-amber-500/5 fade-up">
        <div class="flex items-center gap-2 mb-2"><span class="text-xs font-bold text-amber-400">📌 ЗАКРЕПЛЕНО</span></div>
        <p class="text-sm whitespace-pre-wrap break-words ${isCtrl(first.text) ? 'text-amber-200 font-semibold' : 'text-slate-200'}">${esc(first.text)}</p>
        <p class="text-[11px] text-slate-500 mt-2">${fmtDate(first.createdAt)}</p>
      </div>`;
    const listHtml = rest.length ? rest.map((a) => `
      <div class="rounded-2xl p-4 border fade-up ${isCtrl(a.text) ? 'bg-amber-500/10 border-amber-500/40' : 'bg-slate-900 border-slate-800'}">
        <p class="text-sm whitespace-pre-wrap break-words ${isCtrl(a.text) ? 'text-amber-200 font-semibold' : 'text-slate-200'}">${esc(a.text)}</p>
        <p class="text-[11px] text-slate-500 mt-2">${fmtDate(a.createdAt)}</p>
      </div>`).join('') : '';
    el.innerHTML = pinned + listHtml + buildCalendar();
  }

  function buildCalendar() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const first = new Date(y, m, 1);
    const firstDay = (first.getDay() + 6) % 7;
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const today = now.getDate();
    const annDays = new Set();
    annCache.forEach((a) => {
      if (!a.createdAt) return;
      const d = new Date(a.createdAt);
      if (d.getFullYear() === y && d.getMonth() === m) annDays.add(d.getDate());
    });
    const cells = [];
    for (let i = 0; i < firstDay; i++) cells.push('<div class="cal-day empty"></div>');
    for (let d = 1; d <= daysInMonth; d++) {
      const cls = ['cal-day'];
      if (d === today) cls.push('today');
      else if (annDays.has(d)) cls.push('has-ann');
      cells.push(`<div class="${cls.join(' ')}">${d}</div>`);
    }
    const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const wd = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    return `
      <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 fade-up mt-4">
        <div class="font-bold text-sm mb-3">📅 ${monthNames[m]} ${y}</div>
        <div class="grid grid-cols-7 gap-1 mb-2 text-[10px] text-slate-500 font-bold text-center">
          ${wd.map((w) => `<div>${w}</div>`).join('')}
        </div>
        <div class="grid grid-cols-7 gap-1">${cells.join('')}</div>
        <p class="text-[10px] text-slate-500 mt-2">Синий — сегодня, светлый — день с объявлением</p>
      </div>`;
  }

  /* ============================================================
     ЧАТ: расширенные функции
     ============================================================ */
  const nickColor = (n) => {
    const hue = (n.split('').reduce((a, c) => a + c.charCodeAt(0), 0) * 37) % 360;
    return `hsl(${hue},70%,70%)`;
  };

  // Ответ на сообщение
  let replyTo = null; // { key, nick, text }
  // Редактирование
  let editMsg = null; // { key, text }

  // Реакции: [{emoji, user}]
  function reactionsHtml(msg) {
    const r = msg.reactions || {};
    const byEmoji = {};
    Object.keys(r).forEach((uid) => {
      const emoji = r[uid];
      if (!byEmoji[emoji]) byEmoji[emoji] = [];
      byEmoji[emoji].push(uid);
    });
    const keys = Object.keys(byEmoji);
    if (!keys.length) return '';
    return `<div class="flex flex-wrap gap-1 mt-1.5">${
      keys.map((e) => {
        const users = byEmoji[e];
        const mine = HubAuth.uid && users.includes(HubAuth.uid);
        return `<span class="reaction-pill ${mine ? 'mine' : ''}" data-emoji="${esc(e)}">
          <span>${esc(e)}</span><span>${users.length}</span>
        </span>`;
      }).join('')
    }</div>`;
  }

  function nodeTime(el) { return parseInt(el.getAttribute('data-time') || '0', 10) || 0; }
  function insertSorted(div) {
    const box = $('#chat-messages');
    const t = nodeTime(div);
    const kids = box.children;
    let i = kids.length - 1;
    while (i >= 0 && nodeTime(kids[i]) > t) i--;
    if (i < 0) box.insertBefore(div, box.firstChild);
    else if (i < kids.length - 1) box.insertBefore(div, kids[i].nextSibling);
    else box.appendChild(div);
  }

  function favs() {
    try { return JSON.parse(localStorage.getItem(LS.fav) || '[]'); } catch (e) { return []; }
  }
  function isFav(key) { return favs().some((f) => f.key === key); }
  function toggleFav(msg) {
    let arr = favs();
    if (arr.some((f) => f.key === msg.key)) {
      arr = arr.filter((f) => f.key !== msg.key);
      showToast('Удалено из избранного');
    } else {
      arr.push({ key: msg.key, nick: msg.nick, text: msg.text, time: msg.time, classKey: curClassKey() });
      showToast('Добавлено в избранное');
    }
    localStorage.setItem(LS.fav, JSON.stringify(arr));
    const box = $('#chat-messages');
    const el = box && box.querySelector('[data-msg="' + msg.key + '"]');
    if (el) {
      const star = el.querySelector('.msg-fav');
      if (star) star.textContent = isFav(msg.key) ? '★' : '☆';
    }
  }

  // Считаем - является ли сообщение "моим"
  function isMine(m) {
    if (!HubAuth.uid) return false;
    if (m.uid) return m.uid === HubAuth.uid;
    // Для старых сообщений без uid
    return (m.nick || m.name) === nick();
  }

  function renderMessageEl(key, m) {
    const me = nick();
    const mname = m.nick || m.name || 'Ученик';
    const mine = isMine(m);
    const div = document.createElement('div');
    div.className = `flex ${mine ? 'justify-end' : 'justify-start'} fade-up`;
    div.setAttribute('data-msg', key);
    div.setAttribute('data-time', String(m.time || 0));
    div.setAttribute('data-nick', mname);
    div.setAttribute('data-text', (m.text || '').toLowerCase());
    if (m.uid) div.setAttribute('data-uid', m.uid);

    const star = isFav(key) ? '★' : '☆';

    // Reply-превью
    let replyBlock = '';
    if (m.replyTo && m.replyTo.nick) {
      replyBlock = `<div class="reply-preview">
        <div class="font-bold">↪ ${esc(m.replyTo.nick)}</div>
        <div class="truncate opacity-80">${esc(m.replyTo.text || '')}</div>
      </div>`;
    }

    // Кнопка редактирования (только для своих)
    const editBtn = mine ? `<button class="msg-edit text-[10px] opacity-70 hover:opacity-100 px-1 rounded" title="Редактировать">✎</button>` : '';
    const delBtn = (mine || admin.authorized || altMode()) ? `<button class="msg-del text-[10px] opacity-70 hover:opacity-100 px-1 rounded" title="Удалить">✕</button>` : '';
    const reactBtn = `<button class="msg-react text-[10px] opacity-70 hover:opacity-100 px-1 rounded" title="Реакция">☺</button>`;
    const replyBtn = `<button class="msg-reply text-[10px] opacity-70 hover:opacity-100 px-1 rounded" title="Ответить">↩</button>`;

    // Показываем "изменено"
    const editedMark = m.edited ? '<span class="msg-edited">(изменено)</span>' : '';

    div.innerHTML = `
      <div class="flex items-start gap-2 max-w-[85%] ${mine ? 'flex-row-reverse' : ''}">
        ${avatarHtml(mname, 'sm')}
        <div class="${mine ? 'accent-bg text-white' : 'bg-slate-800'} rounded-2xl px-3.5 py-2 min-w-0 flex-1">
          <div class="flex items-center gap-1 mb-0.5 flex-wrap">
            <span class="text-[11px] font-bold" style="color:${mine ? '#e0e7ff' : nickColor(mname)}">${esc(mname)}</span>
            ${editedMark}
            ${m.flagged ? `<span class="msg-flagmark" title="Помечено фильтром: ${esc(m.flagReason || '')}">⚠</span>` : ''}
            <span class="ml-auto flex items-center gap-0.5">
              <button class="msg-fav text-[12px] opacity-70 hover:opacity-100 px-1 rounded" title="Избранное">${star}</button>
              ${replyBtn}
              ${reactBtn}
              ${editBtn}
              ${delBtn}
            </span>
          </div>
          ${replyBlock}
          <p class="text-sm break-words whitespace-pre-wrap">${formatMessageText(m.text || '')}</p>
          ${reactionsHtml(m)}
          <div class="text-[10px] opacity-60 mt-1 text-right">${fmtDate(m.time || Date.now())}</div>
        </div>
      </div>`;
    return div;
  }

  function onChatMessage(snap) {
    const m = snap.val();
    if (!m || !m.text) return;
    const key = snap.key;
    const box = $('#chat-messages');
    if (box.querySelector('[data-msg="' + key + '"]')) return;
    const div = renderMessageEl(key, m);
    insertSorted(div);
    chatMaxCount = Math.max(chatMaxCount, box.querySelectorAll('[data-msg]').length);
    scrollChat();
    applyChatSearch();
    // Счётчик непрочитанных, если вкладка чата не открыта и сообщение не от меня
    if ($('#tab-chat').classList.contains('hidden') && !isMine(m)) {
      incrementUnread();
    }
  }

  function onChatChanged(snap) {
    const m = snap.val();
    if (!m) return;
    const key = snap.key;
    const box = $('#chat-messages');
    const el = box.querySelector('[data-msg="' + key + '"]');
    if (!el) return;
    // Пересобираем сообщение (могло измениться: текст, reactions, edited)
    const newEl = renderMessageEl(key, m);
    el.replaceWith(newEl);
    applyChatSearch();
  }

  let chatMaxCount = 0;
  let chatFetchBusy = false;

  function renderChat(items) {
    const box = $('#chat-messages');
    if (items.length < chatMaxCount) return false;
    box.innerHTML = '';
    chatMaxCount = Math.max(chatMaxCount, items.length);
    items.sort((a, b) => (a.time || 0) - (b.time || 0)).forEach((m) => {
      const div = renderMessageEl(m.key, m);
      box.appendChild(div);
    });
    if (!$('#tab-chat').classList.contains('hidden')) scrollChat();
    return true;
  }
  function refreshChat(tries) {
    if (chatFetchBusy) { setTimeout(() => refreshChat(tries || 0), 800); return; }
    chatFetchBusy = true;
    const path = curClassPath();
    db.ref(path + '/chat').once('value', (snap) => {
      chatFetchBusy = false;
      if (curClassPath() !== path || renderChat(snapArr(snap))) return;
      if ((tries || 0) < 3) setTimeout(() => refreshChat((tries || 0) + 1), 1500);
    }, (err) => {
      chatFetchBusy = false;
      showToast('Ошибка чата: ' + (err && err.message ? err.message : err));
    });
  }
  let chatPollTimer = null;
  function startChatPoll() { clearChatPoll(); chatPollTimer = setInterval(pollChat, 12000); }
  function clearChatPoll() { if (chatPollTimer) { clearInterval(chatPollTimer); chatPollTimer = null; } }
  function pollChat() {
    const tab = $('#tab-chat');
    if (!tab || tab.classList.contains('hidden') || chatFetchBusy) return;
    chatFetchBusy = true;
    db.ref(curClassPath() + '/chat').once('value', (snap) => {
      chatFetchBusy = false;
      const remote = snapArr(snap);
      const remoteKeys = new Set(remote.map((m) => m.key));
      const nodes = $('#chat-messages').querySelectorAll('[data-msg]');
      const localKeys = new Set(Array.from(nodes).map((n) => n.dataset.msg));
      const hasNew = [...remoteKeys].some((k) => !localKeys.has(k));
      if (hasNew && remote.length >= chatMaxCount) { renderChat(remote); return; }
      if (!hasNew && remoteKeys.size === localKeys.size - 1) {
        const gone = [...localKeys].find((k) => !remoteKeys.has(k));
        if (gone) forgetMsg(gone);
      }
    });
  }
  function forgetMsg(key) {
    const box = $('#chat-messages');
    const el = box.querySelector('[data-msg="' + key + '"]');
    if (el) el.remove();
    chatMaxCount = box.querySelectorAll('[data-msg]').length;
  }
  function scrollChat() {
    const box = $('#chat-messages');
    box.scrollTop = box.scrollHeight;
  }

  /* ---- Поиск ---- */
  function applyChatSearch() {
    const q = ($('#chat-search-input') && $('#chat-search-input').value || '').trim().toLowerCase();
    const box = $('#chat-messages');
    if (!box) return;
    box.querySelectorAll('[data-msg]').forEach((el) => {
      const text = (el.getAttribute('data-text') || '');
      const nick = (el.getAttribute('data-nick') || '').toLowerCase();
      const hit = !q || text.includes(q) || nick.includes(q);
      el.classList.toggle('msg-hidden', !hit);
    });
  }

  /* ---- Ответ на сообщение ---- */
  function setReply(key, nickName, text) {
    replyTo = { key, nick: nickName, text: text.slice(0, 120) };
    $('#chat-reply-nick').textContent = nickName;
    $('#chat-reply-text').textContent = text.slice(0, 120);
    $('#chat-reply-box').classList.remove('hidden');
    $('#chat-input').focus();
  }
  function clearReply() {
    replyTo = null;
    $('#chat-reply-box').classList.add('hidden');
  }

  /* ---- Редактирование ---- */
  function setEdit(key, text) {
    editMsg = { key, text };
    $('#chat-edit-text').textContent = text.slice(0, 120);
    $('#chat-edit-box').classList.remove('hidden');
    $('#chat-input').value = text;
    $('#chat-input').focus();
  }
  function clearEdit() {
    editMsg = null;
    $('#chat-edit-box').classList.add('hidden');
    $('#chat-input').value = '';
  }

  /* ---- Реакции ---- */
  const REACTION_EMOJIS = ['👍','❤️','😂','🔥','😮','😢','🎉','🤔','👏','💯','😍','🤯'];
  function showReactionsBar(msgKey, anchorEl) {
    const old = document.getElementById('reactions-bar');
    if (old) old.remove();
    const bar = document.createElement('div');
    bar.id = 'reactions-bar';
    bar.className = 'reactions-bar';
    bar.innerHTML = REACTION_EMOJIS.map((e) => `<button data-emoji="${e}">${e}</button>`).join('');
    document.body.appendChild(bar);
    const r = anchorEl.getBoundingClientRect();
    bar.style.top = (window.scrollY + r.top - 44) + 'px';
    bar.style.left = Math.max(8, Math.min(window.innerWidth - bar.offsetWidth - 8, r.left)) + 'px';
    bar.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-emoji]');
      if (!btn) return;
      toggleReaction(msgKey, btn.dataset.emoji);
      bar.remove();
    });
    // Закрытие по клику вне
    setTimeout(() => {
      const close = (ev) => {
        if (!bar.contains(ev.target)) { bar.remove(); document.removeEventListener('click', close); }
      };
      document.addEventListener('click', close);
    }, 50);
  }
  function toggleReaction(msgKey, emoji) {
    if (!HubAuth.uid) return;
    const ref = db.ref(curClassPath() + '/chat/' + msgKey + '/reactions/' + HubAuth.uid);
    ref.once('value', (s) => {
      if (s.val() === emoji) ref.remove();
      else ref.set(emoji);
    });
  }

  /* ---- Статус "печатает..." ---- */
  let typingBeacon = null;
  let lastTypingSent = 0;
  function startTypingBeacon() {
    if (typingBeacon) return;
    const me = nick();
    if (!me || !HubAuth.uid) return;
    const doSend = () => {
      if (!db) return;
      db.ref(curClassPath() + '/typing/' + HubAuth.uid).set({
        nick: me, at: firebase.database.ServerValue.TIMESTAMP
      }).then(() => {
        // Автоудаление через 3 сек
        setTimeout(() => {
          db.ref(curClassPath() + '/typing/' + HubAuth.uid).remove().catch(() => {});
        }, 3000);
      }).catch(() => {});
    };
    typingBeacon = true;
    lastTypingSent = 0;
  }
  function stopTypingBeacon() {
    if (!HubAuth.uid) return;
    if (db) db.ref(curClassPath() + '/typing/' + HubAuth.uid).remove().catch(() => {});
    typingBeacon = null;
  }
  function onTypingUpdate(snap) {
    const v = snap.val() || {};
    const now = Date.now();
    const users = [];
    Object.keys(v).forEach((uid) => {
      if (uid === HubAuth.uid) return;
      const t = v[uid];
      if (t && t.at && (now - t.at) < 5000 && t.nick) users.push(t.nick);
    });
    const el = $('#typing-indicator');
    if (!el) return;
    if (!users.length) { el.textContent = ''; return; }
    if (users.length === 1) el.textContent = users[0] + ' печатает…';
    else if (users.length === 2) el.textContent = users[0] + ' и ' + users[1] + ' печатают…';
    else el.textContent = users.length + ' человека печатают…';
  }

  /* ---- Счётчик непрочитанных ---- */
  function getLastRead() {
    try {
      const data = JSON.parse(localStorage.getItem(LS.lastRead) || '{}');
      return data[curClassKey()] || 0;
    } catch (e) { return 0; }
  }
  function setLastRead(ts) {
    let data = {};
    try { data = JSON.parse(localStorage.getItem(LS.lastRead) || '{}'); } catch (e) {}
    data[curClassKey()] = ts;
    localStorage.setItem(LS.lastRead, JSON.stringify(data));
  }
  let unreadCount = 0;
  function incrementUnread() {
    unreadCount++;
    paintUnreadBadge();
  }
  function markChatRead() {
    const box = $('#chat-messages');
    if (!box) return;
    const nodes = box.querySelectorAll('[data-msg]');
    let maxT = 0;
    nodes.forEach((n) => {
      const t = parseInt(n.getAttribute('data-time') || '0', 10);
      if (t > maxT) maxT = t;
    });
    if (maxT) setLastRead(maxT);
    unreadCount = 0;
    paintUnreadBadge();
  }
  function paintUnreadBadge() {
    const el = $('#chat-unread');
    if (!el) return;
    if (unreadCount > 0) {
      el.textContent = unreadCount > 99 ? '99+' : String(unreadCount);
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  }
  function updateUnreadBadge() {
    // При заходе: если есть сообщения новее lastRead — считаем
    const lastRead = getLastRead();
    db.ref(curClassPath() + '/chat').once('value', (snap) => {
      const items = snapArr(snap);
      unreadCount = items.filter((m) => (m.time || 0) > lastRead && !isMine(m)).length;
      paintUnreadBadge();
    });
  }

  /* ---- Отправка сообщения ---- */
  function sendMessage(e) {
    e.preventDefault();
    const input = $('#chat-input');
    const text = input.value.trim();
    if (!text) return;
    if (!nick()) { showToast('Сначала задайте ник'); askNickIfNeeded(); return; }
    if (!HubAuth.uid || !HubAuth.ready) { showToast('Авторизация ещё не готова'); return; }
    const me = nick();
    HubModeration.checkCanSend((err) => {
      if (err) { showToast(err); return; }
      ensureProfile();
      const s = state.sel;
      // Редактирование
      if (editMsg) {
        db.ref(curClassPath() + '/chat/' + editMsg.key).update({
          text: text,
          edited: true,
          editedAt: Date.now(),
        }).then(() => {
          clearEdit();
          showToast('Сообщение изменено');
        }).catch((err2) => showToast('Ошибка: ' + (err2.message || err2)));
        return;
      }
      // Обычная отправка (с reply, если есть)
      const msg = {
        uid: HubAuth.uid,
        deviceId: deviceId(),
        nick: me,
        text: text,
        time: Date.now(),
        class: (s && s.clname) || ''
      };
      if (replyTo) {
        msg.replyTo = { key: replyTo.key, nick: replyTo.nick, text: replyTo.text };
      }
      const badHits = findBadWords(text);
      if (badHits.length) {
        msg.flagged = true;
        msg.flagReason = badHits.slice(0, 3).join(', ');
      }
      const chatRef = db.ref(curClassPath() + '/chat');
      const pushed = chatRef.push(msg);
      if (badHits.length) {
        db.ref('/flagged_messages' + curClassPath().slice('/cities'.length) + '/' + pushed.key)
          .set(msg).catch(() => {});
      }
      clearReply();
    });
    input.value = '';
    setTimeout(refreshChat, 500);

  /* ---- Модалка ника ---- */
  function askNickIfNeeded() {

  /* ---- Экспорт чата ---- */
  function exportChat() {
    const box = $('#chat-messages');
    if (!box) return;
    const nodes = Array.from(box.querySelectorAll('[data-msg]'));
    if (!nodes.length) { showToast('Сообщений нет'); return; }
    const lines = nodes.map((n) => {
      const nickName = n.getAttribute('data-nick') || '?';
      const time = fmtDate(parseInt(n.getAttribute('data-time') || '0', 10));
      const text = n.querySelector('p') ? n.querySelector('p').textContent : '';
      return `[${time}] ${nickName}: ${text}`;
    });
    const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'chat-' + curClassKey().replace(/\|/g, '_') + '.txt';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Чат сохранён в TXT');
  }

    const el = $('#bdays-list');
    if (!el) return;

    if (!arr.length) { el.innerHTML = '<p class="text-[11px] text-slate-500">Пока никого</p>'; return; }
    const today = new Date();
    const p = (n) => String(n).padStart(2, '0');
    const todayMD = p(today.getMonth() + 1) + '-' + p(today.getDate());
    el.innerHTML = arr.map((b, i) => {
      const isToday = b.date.slice(5) === todayMD;
      return `
        <div class="flex items-center justify-between gap-2 text-xs">
          <span class="${isToday ? 'font-bold accent-text' : ''}">${esc(b.name)}</span>
          <span class="text-slate-500">${b.date.slice(5).split('-').reverse().join('.')}${isToday ? ' 🎉' : ''}</span>
          <button class="bday-del text-slate-500 hover:text-rose-400 px-1" data-i="${i}">✕</button>
        </div>`;
    }).join('');
    el.querySelectorAll('.bday-del').forEach((b) => b.addEventListener('click', () => {
      let a = [];
      try { a = JSON.parse(localStorage.getItem(LS.bdays) || '[]'); } catch (e) {}

  /* ---- Долгое нажатие / N тапов ---- */
  function bindLongPress(el, cb) {
    let timer = null;
    const start = () => { timer = setTimeout(() => { timer = null; el.classList.add('hold'); cb(); }, 3000); };
    const stop = () => { clearTimeout(timer); timer = null; el.classList.remove('hold'); };
    el.addEventListener('pointerdown', start);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => el.addEventListener(ev, stop));
  }
  function bindNTaps(el, n, cb) {
    let count = 0, timer = null;
    el.addEventListener('click', () => {
      count++;
      clearTimeout(timer);
      timer = setTimeout(() => { count = 0; }, 2000);
      if (count >= n) { count = 0; cb(); }
    });
  }

          const wrap = editor.querySelector('#ann-list');
          wrap.innerHTML = items.length ? items.map((a) => `
            <div class="row rounded-xl bg-slate-900 border border-slate-800 p-3 space-y-2 fade-up">
              <p class="text-sm whitespace-pre-wrap break-words">${esc(a.text || '')}</p>
              <p class="text-[11px] text-slate-500">${fmtDate(a.createdAt)}</p>
              <button data-ann-del data-key="${esc(a.key)}" class="rounded-lg px-3 py-2 text-xs font-bold bg-rose-600">Удалить</button>
            </div>`).join('') : emptyNote('Пусто');
        });
      }
    };
    addRef(adminRefs, db.ref(P.cities())).on('value', (snap) => {
      const cities = snapArr(snap);
      selCity.innerHTML = '<option value="">— город —</option>' + cities.map((c) => `<option value="${esc(c.key)}">${esc(c.name || '')}</option>`).join('');
      if (admin.city && cities.some((c) => c.key === admin.city)) selCity.value = admin.city;
      selSchool.innerHTML = '<option value="">— школа —</option>';
      selClass.innerHTML = '<option value="">— класс —</option>';
      if (admin.city) {
        db.ref(P.schools(admin.city)).once('value', (ss) => {
          const schools = snapArr(ss);
          selSchool.innerHTML = '<option value="">— школа —</option>' + schools.map((s) => `<option value="${esc(s.key)}">${esc(s.name || '')}</option>`).join('');
          if (admin.school && schools.some((s) => s.key === admin.school)) {
            selSchool.value = admin.school;
            db.ref(P.classes(admin.city, admin.school)).once('value', (cs) => {
              const classes = snapArr(cs);
              selClass.innerHTML = '<option value="">— класс —</option>' + classes.map((c) => `<option value="${esc(c.key)}">${esc(c.name || '')}</option>`).join('');
              if (admin.cls && classes.some((c) => c.key === admin.cls)) selClass.value = admin.cls;
              loadEditor();
            });
          } else loadEditor();
        });
      } else loadEditor();
    });
    selCity.addEventListener('change', () => { admin.city = selCity.value || null; admin.school = admin.cls = null; renderAdminPage('content'); });
    selSchool.addEventListener('change', () => { admin.school = selSchool.value || null; admin.cls = null; renderAdminPage('content'); });
    selClass.addEventListener('change', () => { admin.cls = selClass.value || null; renderAdminPage('content'); });
  }

  function scheduleEditorForm() {
    const days = [['mon','Пн'],['tue','Вт'],['wed','Ср'],['thu','Чт'],['fri','Пт'],['sat','Сб'],['sun','Вс']];
    return `
      <div class="space-y-2 max-h-[40vh] overflow-y-auto pr-1">
        ${days.map(([k, n]) => `
          <div>
            <label class="text-xs text-slate-400 block mb-1">${n}</label>
            <textarea id="sch-${k}" rows="3" class="${aInput('w-full resize-none')}"></textarea>
          </div>`).join('')}
      </div>
      <button id="sch-sync" class="w-full rounded-lg px-3 py-3 text-sm font-bold bg-sky-600 text-white mt-3 mb-2">🔄 Синхронизировать с Ника-Софт</button>
      <button id="sch-save" class="w-full rounded-lg px-3 py-3 text-sm font-bold bg-emerald-600 text-white">Сохранить</button>`;
  }

  function renderAdminPeople(body) {
    body.innerHTML = `<p class="text-xs text-slate-500">Модерация (заглушка).</p>`;
  }
  function renderAdminStats(body) {
    body.innerHTML = `<div id="stats-cards" class="grid grid-cols-3 gap-2">${spinner()}</div>
      <div id="stats-extra" class="mt-3 rounded-2xl bg-slate-900 border border-slate-800 p-4">${spinner()}</div>
      <div class="mt-3 rounded-2xl bg-slate-900 border border-slate-800 p-4">
        <div class="font-bold text-sm mb-2">📌 Интересное</div>
        <div id="stats-flagged">${spinner()}</div>
      </div>`;

    const safe = (ref) => ref.once('value').then((s) => s.val() || {}).catch(() => null);
    const dayMs = 86400000;

    (async () => {
      const cv = await safe(db.ref('/cities'));
      let c = 0, s = 0, cl = 0;
      const classRefs = [], classNames = {};
      const meta = cv || {};
      Object.keys(meta).forEach((cid) => {
        c++;
        const cn = meta[cid] || {};
        const schV = cn.schools || {};
        Object.keys(schV).forEach((sid) => {
          s++;
          const sn = schV[sid] || {};
          Object.keys(sn.classes || {}).forEach((clid) => {
            cl++;
            classRefs.push(db.ref(P.classNode(cid, sid, clid)));
            classNames[cid + '/' + sid + '/' + clid] = { cname: cn.name || cid, sname: sn.name || sid, clname: ((sn.classes || {})[clid] || {}).name || clid };
          });
        });
      });
      $('#stats-cards').innerHTML = `
        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-3"><div class="text-2xl font-extrabold">${c}</div><div class="text-[11px] text-slate-500">Города</div></div>
        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-3"><div class="text-2xl font-extrabold">${s}</div><div class="text-[11px] text-slate-500">Школы</div></div>
        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-3"><div class="text-2xl font-extrabold">${cl}</div><div class="text-[11px] text-slate-500">Классы</div></div>`;

      const latestMsg = (ref) => ref.orderByChild('time').limitToLast(1).once('value')
        .then((sn) => { let latest = 0; sn.forEach((ch) => { latest = Math.max(latest, Number((ch.val() && ch.val().time) || 0)); }); return latest; })
        .catch(() => null);
      const [ov, uv, actL] = await Promise.all([
        safe(db.ref('/online')),
        safe(db.ref('/unique')),
        Promise.all(classRefs.map(latestMsg)),
      ]);
      const row = (label, val) => `
        <div class="flex items-center justify-between py-2 border-b border-slate-800/60 last:border-0">
          <span class="text-xs text-slate-400">${label}</span>
          ${val == null ? '<span class="text-[11px] text-rose-400">доступ запрещён правилами</span>' : `<span class="text-sm font-bold">${val}</span>`}
        </div>`;
      const now5 = Date.now() - 300000;
      const now24 = Date.now() - dayMs;
      $('#stats-extra').innerHTML = [
        row('Онлайн сейчас (5 мин)', ov == null ? null : Object.values(ov).filter((t) => Number(t) > now5).length),
        row('Уникальные пользователи (всего)', uv == null ? null : Object.keys(uv).length),
        row('Уникальные (за 24 ч)', uv == null ? null : Object.values(uv).filter((t) => Number(t) > now24).length),
        row('Активные классы (24 ч)', actL == null ? null : actL.filter((t) => t != null && t > now24).length),
      ].join('');

      // 📌 Интересное: помеченные фильтром сообщения
      const fEl = $('#stats-flagged');
      const [fv, usv, bv] = await Promise.all([
        safe(db.ref('/flagged_messages')),
        safe(db.ref('/users')),
        safe(db.ref('/bannedUsers')),
      ]);
      if (fv == null) { fEl.innerHTML = emptyNote('Раздел «Интересное» не доступен — опубликуйте правила из rules.json'); return; }
      const fEntries = [];
      Object.keys(fv).forEach((cid) => {
        Object.keys(fv[cid] || {}).forEach((sid) => {
          Object.keys(fv[cid][sid] || {}).forEach((clid) => {
            Object.keys(fv[cid][sid][clid] || {}).forEach((key) => {
              fEntries.push({ cid, sid, clid, key, m: fv[cid][sid][clid][key] || {} });
            });
          });
        });
      });
      fEntries.sort((a, b) => (a.m.time || 0) - (b.m.time || 0));
      if (!fEntries.length) { fEl.innerHTML = emptyNote('Помеченных сообщений нет'); return; }
      const users = usv || {};
      const deviceToUid = {}, usersById = {};
      Object.keys(users).forEach((uid) => { const pr = users[uid] || {}; usersById[uid] = pr; if (pr.deviceId) deviceToUid[pr.deviceId] = uid; });
      const bans = bv || {};
      fEl.innerHTML = fEntries.map((f) => {
        const uid = f.m.uid || deviceToUid[f.m.deviceId] || '';
        const nick2 = (uid && usersById[uid] && usersById[uid].nick) || f.m.nick || f.m.name || 'Ученик';
        const st = uid ? HubModeration.statusOf(bans[uid] || null) : { label: 'не определён', cls: 'text-slate-500' };
        const mn = classNames[f.cid + '/' + f.sid + '/' + f.clid] || { cname: f.cid, sname: f.sid, clname: f.clid };
        const fdata = JSON.stringify({ cid: f.cid, sid: f.sid, clid: f.clid, key: f.key, cname: mn.cname, sname: mn.sname, clname: mn.clname });
        const dis = uid ? '' : ' opacity-40 pointer-events-none';
        const bt = (label, act, extra) => `<button data-act="${act}" ${extra} class="rounded-lg bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 text-[11px] font-semibold">${label}</button>`;
        return `
        <div class="border-b border-slate-800/60 py-2.5">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <span class="text-xs font-bold">${esc(nick2)} <span class="text-[10px] text-slate-500">${esc(mn.cname)}, ${esc(mn.sname)}, ${esc(mn.clname)}</span></span>
            <span class="text-[10px] text-slate-500">${fmtDate(f.m.time)}</span>
          </div>
          <p class="text-sm mt-1 break-words">${esc(f.m.text || '')}</p>
          <div class="text-[11px] mt-1 ${st.cls}">${uid ? 'UID: ' + esc(uid).slice(0, 14) + '…' : 'UID не определён'} · ${esc(st.label)}</div>
          <div class="flex gap-1.5 mt-2 flex-wrap">
            ${bt('Открыть чат', 'flagOpen', `data-f="${esc(fdata)}"`)}
            ${bt('Игнорировать', 'flagIgnore', `data-f="${esc(fdata)}"`)}
            ${bt('Удалить', 'flagDel', `data-f="${esc(fdata)}"`)}
            <span class="flex gap-1.5 flex-wrap${dis}">
              ${bt('Мут 1 час', 'flagMute1', `data-uid="${esc(uid)}"`)}
              ${bt('Мут 24 часа', 'flagMute24', `data-uid="${esc(uid)}"`)}
              ${bt('Разбанить', 'flagUnban', `data-uid="${esc(uid)}"`)}
              ${bt('Предупредить', 'flagWarn', `data-uid="${esc(uid)}"`)}
            </span>
          </div>
        </div>`;
      }).join('');
    })();
  }

  function bindAdminActions() {
    $('#admin-body').addEventListener('click', (e) => {
      const t = e.target.closest('button[data-act]') ||
                e.target.closest('button[data-hw-save]') ||
                e.target.closest('button[data-hw-del]') ||
                e.target.closest('button[data-ann-del]');
      if (!t) return;
      const act = t.dataset.act;
      if (act === 'citySave') {
        const name = t.closest('.row').querySelector('[data-act="cityName"]').value.trim();
        db.ref(P.cities() + '/' + t.dataset.key).update({ name });
      }
      if (act === 'cityDelete') askConfirm('Удалить город?', () => db.ref(P.cities() + '/' + t.dataset.key).remove());
      if (act === 'schoolSave') {
        const cid = $('#school-city').value;
        const name = t.closest('.row').querySelector('[data-act="schoolName"]').value.trim();
        db.ref(P.schools(cid) + '/' + t.dataset.key).update({ name });
      }
      if (act === 'schoolDelete') askConfirm('Удалить школу?', () => db.ref(P.schools($('#school-city').value) + '/' + t.dataset.key).remove());
      if (act === 'classSave') {
        const cid = $('#class-city').value, sid = $('#class-school').value;
        const name = t.closest('.row').querySelector('[data-act="className"]').value.trim();
        db.ref(P.classes(cid, sid) + '/' + t.dataset.key).update({ name });
      }
      if (act === 'classDelete') askConfirm('Удалить класс?', () => db.ref(P.classes($('#class-city').value, $('#class-school').value) + '/' + t.dataset.key).remove());
      if ('hwSave' in t.dataset) {
        const row = t.closest('.row');
        const subj = row.querySelector('[data-hw-key]').value.trim();
        const task = row.querySelector('[data-hw-task]').value;
        if (!subj) return;
        const node = db.ref(P.classNode(admin.city, admin.school, admin.cls) + '/homework');
        if (subj !== t.dataset.key) node.child(t.dataset.key).remove();
        node.child(subj).set(task);
      }
      if ('hwDel' in t.dataset) db.ref(P.classNode(admin.city, admin.school, admin.cls) + '/homework/' + t.dataset.key).remove();
      if ('annDel' in t.dataset) askConfirm('Удалить?', () => db.ref(P.classNode(admin.city, admin.school, admin.cls) + '/announcements/' + t.dataset.key).remove());

      // ---- «Интересное»: модерация авторов и сообщений ----
      if (act === 'flagMute1' || act === 'flagMute24') {
        const uid = t.dataset.uid;
        if (!uid) { showToast('Нет UID автора'); return; }
        HubModeration.muteHours(uid, act === 'flagMute1' ? 1 : 24, 'мут администратором')
          .then(() => { showToast('Мут применён'); renderAdminPage('stats'); })
          .catch((e) => showToast('Не удалось замутить: ' + ((e && e.message) ? e.message : 'нет прав')));
      }
      if (act === 'flagUnban') {
        const uid = t.dataset.uid;
        if (!uid) return;
        HubModeration.unban(uid)
          .then(() => { showToast('Бан снят'); renderAdminPage('stats'); })
          .catch((e) => showToast('Не удалось снять бан: ' + ((e && e.message) ? e.message : 'нет прав')));
      }
      if (act === 'flagWarn') {
        const uid = t.dataset.uid;
        if (!uid) { showToast('Нет UID автора'); return; }
        const text = window.prompt('Текст предупреждения:');
        if (text == null) return;
        db.ref('/warnings/' + uid).push({ text: String(text).slice(0, 300), at: firebase.database.ServerValue.TIMESTAMP })
          .then(() => showToast('Предупреждение отправлено'))
          .catch((e) => showToast('Не удалось отправить: ' + ((e && e.message) ? e.message : 'нет прав')));
      }
      if (act === 'flagIgnore' || act === 'flagDel') {
        const f = JSON.parse(t.dataset.f || '{}');
        if (act === 'flagDel') {
          askConfirm('Удалить сообщение?', () => {
            db.ref(P.classNode(f.cid, f.sid, f.clid) + '/chat/' + f.key).remove()
              .catch((e) => showToast('Не удалось удалить: ' + ((e && e.message) ? e.message : 'нет прав')));
            db.ref('/flagged_messages/' + f.cid + '/' + f.sid + '/' + f.clid + '/' + f.key).remove().catch(() => {});
            renderAdminPage('stats');
          });
        } else {
          db.ref('/flagged_messages/' + f.cid + '/' + f.sid + '/' + f.clid + '/' + f.key).remove().catch(() => {});
          renderAdminPage('stats');
        }
      }
      if (act === 'flagOpen') {
        const f = JSON.parse(t.dataset.f || '{}');
        $('#admin-panel').classList.add('hidden');
        state.sel = { cid: f.cid, cname: f.cname, sid: f.sid, sname: f.sname, clid: f.clid, clname: f.clname };
        saveSelection();
        showMainScreen();
        switchTab('chat');
      }
    });
  }

  /* ============================================================
     ИНИЦИАЛИЗАЦИЯ СОБЫТИЙ
     ============================================================ */
  $('#toast-close').addEventListener('click', hideToast);
  $('#back-btn').addEventListener('click', onBack);
  $('#change-btn').addEventListener('click', resetSelection);
  $$('.tab-btn').forEach((b) => b.addEventListener('click', () => switchTab(b.dataset.tab)));
  $('#chat-form').addEventListener('submit', sendMessage);
  $('#chat-nick').addEventListener('click', changeNick);

  // Ввод в чате: статус "печатает..."
  $('#chat-input').addEventListener('input', () => {
    if (!typingBeacon) startTypingBeacon();
    const now = Date.now();
    if (now - lastTypingSent > 2500) {
      lastTypingSent = now;
      const me = nick();
      if (me && HubAuth.uid) {
        db.ref(curClassPath() + '/typing/' + HubAuth.uid).set({
          nick: me, at: firebase.database.ServerValue.TIMESTAMP
        }).then(() => {
          setTimeout(() => {
            db.ref(curClassPath() + '/typing/' + HubAuth.uid).remove().catch(() => {});
          }, 3000);
        }).catch(() => {});
      }
    }
    // Живой сброс edit, если очистили
    if (editMsg && !$('#chat-input').value.trim()) clearEdit();
  });

  // Reply/Edit: закрытие
  $('#chat-reply-close').addEventListener('click', clearReply);
  $('#chat-edit-close').addEventListener('click', clearEdit);

  // Клики по сообщениям: реакция, reply, edit, del, fav
  $('#chat-messages').addEventListener('click', (e) => {
    const wrap = e.target.closest('[data-msg]');
    if (!wrap) return;
    const key = wrap.dataset.msg;

    const fav = e.target.closest('.msg-fav');
    if (fav) {
      const p = wrap.querySelector('p');
      toggleFav({ key, nick: wrap.getAttribute('data-nick'), text: p ? p.textContent : '', time: parseInt(wrap.getAttribute('data-time') || '0', 10) });
      return;
    }

    const reply = e.target.closest('.msg-reply');
    if (reply) {
      const nk = wrap.getAttribute('data-nick') || '?';
      const p = wrap.querySelector('p');
      setReply(key, nk, p ? p.textContent : '');
      return;
    }

    const react = e.target.closest('.msg-react');
    if (react) {
      showReactionsBar(key, wrap);
      return;
    }

    const edit = e.target.closest('.msg-edit');
    if (edit) {
      const p = wrap.querySelector('p');
      setEdit(key, p ? p.textContent : '');
      return;
    }

    const del = e.target.closest('.msg-del');
    if (del) {
      askConfirm('Удалить сообщение?', () => {
        db.ref(curClassPath() + '/chat/' + key).remove()
          .then(() => forgetMsg(key))
          .catch((e) => showToast('Не удалось удалить: ' + ((e && e.message) ? e.message : 'нет прав')));
      });
      return;
    }
  });

  // Клик по реакции (изменить/удалить свою)
  $('#chat-messages').addEventListener('click', (e) => {
    const pill = e.target.closest('.reaction-pill');
    if (!pill) return;
    const wrap = pill.closest('[data-msg]');
    if (!wrap) return;
    toggleReaction(wrap.dataset.msg, pill.dataset.emoji);
  });

  $('#nick-save').addEventListener('click', saveNick);
  $('#nick-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveNick(); });
  $('#pass-btn').addEventListener('click', tryLogin);
  $('#pass-cancel').addEventListener('click', closePassModal);
  $('#pass-overlay').addEventListener('click', closePassModal);
  $('#pass-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); });
  $('#admin-close').addEventListener('click', closeAdmin);
  $('#admin-overlay').addEventListener('click', closeAdmin);
  $$('#admin-nav button').forEach((b) => b.addEventListener('click', () => renderAdminPage(b.dataset.apage)));
  bindAdminActions();

  $('#chat-search-btn').addEventListener('click', () => {
    const box = $('#chat-search-box');
    box.classList.toggle('hidden');
    if (!box.classList.contains('hidden')) setTimeout(() => $('#chat-search-input').focus(), 100);
    else { $('#chat-search-input').value = ''; applyChatSearch(); }
  });
  $('#chat-search-input').addEventListener('input', applyChatSearch);

  $('#fav-close').addEventListener('click', () => { $('#fav-modal').classList.add('hidden'); $('#fav-modal').classList.remove('flex'); });
  $('#fav-modal').addEventListener('click', (e) => {
    if (e.target === $('#fav-modal')) { $('#fav-modal').classList.add('hidden'); $('#fav-modal').classList.remove('flex'); }
  });

  bindLongPress($('#header-title'), openAdmin);
  bindNTaps($('#logo'), 5, openAdmin);
  bindLongPress($('#auth-title'), openAdmin);
  bindNTaps($('#auth-logo'), 5, openAdmin);

  /* ---- Запуск ---- */
  function start() {
    initSeen();
    initFirebase();
    if (!isConfigured()) { showAuth(); return; }
    loadSelection();
    const s = state.sel;
    if (s && s.cid && s.sid && s.clid) showMainScreen();
    else showAuth();
    seedSchool25();
    HubAuth.start(() => {
      startPresence();
      ensureProfile();
      checkWarnings();
    });
  }
  document.addEventListener('DOMContentLoaded', start);

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => { if (reg.update) reg.update(); }).catch(() => {});
    });
  }
  </script>

  <script>
    window.addEventListener('error', function (ev) {
      var msg = (ev && ev.message) || 'Неизвестная ошибка';
      var auth = document.getElementById('auth-screen');
      if (!auth || auth.classList.contains('hidden')) return;
      var d = document.getElementById('select-list');
      if (d) d.innerHTML = '<div class="text-center py-10 text-amber-400 text-sm">Ошибка: ' + msg + '</div>';
    });
  </script>
</body>
</html>
